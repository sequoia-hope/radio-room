<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: the soft keyboard shrinks the layout
     viewport rather than sliding the page up, so the full-screen terminal can
     size itself to what is left. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111417">
<link rel="icon" href="data:,">
<title>Radio Room</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #111417; color: #e7ecf1;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; background: #1b2026; border-bottom: 1px solid #2a3138;
    position: sticky; top: 0; z-index: 5;
  }
  select#project {
    flex: 1; min-width: 0; font-size: 17px; padding: 8px 10px;
    background: #10151a; color: #e7ecf1; border: 1px solid #2a3138; border-radius: 10px;
    appearance: none; -webkit-appearance: none;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: #3ecf6f; box-shadow: 0 0 6px #3ecf6f88; }
  button { font: inherit; color: inherit; border: none; cursor: pointer; }
  .icon {
    background: #10151a; border: 1px solid #2a3138; border-radius: 10px;
    min-width: 42px; min-height: 42px; font-size: 18px; flex: none;
  }
  #controls {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    background: #151a1f; border-bottom: 1px solid #2a3138;
  }
  #musicBtn {
    background: #10151a; border: 1px solid #2a3138; border-radius: 8px;
    min-width: 40px; min-height: 32px; font-size: 13px; color: #9fb0c0; flex: none;
  }
  #musicBtn.on { color: #7fd3ae; border-color: #2d5c4b; }
  #ttsSpeed {
    display: flex; margin-left: auto; flex: none; overflow: hidden;
    background: #10151a; border: 1px solid #2a3138; border-radius: 8px;
  }
  #ttsSpeed button {
    padding: 0 10px; min-height: 30px; font-size: 12px;
    background: transparent; color: #7b8894;
  }
  #ttsSpeed button.on { background: #2a5db0; color: #fff; }
  /* Same look as the speed buttons, minus the push to the right. */
  #listenPause {
    display: flex; align-items: center; flex: none; overflow: hidden;
    background: #10151a; border: 1px solid #2a3138; border-radius: 8px;
  }
  #listenPause span { padding: 0 4px 0 9px; font-size: 12px; color: #56616c; }
  #listenPause button {
    padding: 0 9px; min-height: 30px; font-size: 12px;
    background: transparent; color: #7b8894;
  }
  #listenPause button.on { background: #2a5db0; color: #fff; }
  #musicLabel {
    flex: 1; min-width: 0; font-size: 12px; color: #7b8894; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Opens the full-screen live terminal on the agent being talked to. */
  button#termRow {
    display: block; width: 100%; text-align: left; flex: none;
    background: #0c0f12; border-bottom: 1px solid #2a3138;
    padding: 9px 14px; color: #8fc7ff; font-size: 14px;
  }
  main.chat { flex: 1; overflow-y: auto; padding: 12px 12px 6px; -webkit-overflow-scrolling: touch;
              min-height: 0; }
  /* One column on a phone, three on a desktop. Narrow, the view switch decides
     what you see; wide, everything is on screen at once and it decides only
     which column the mic is talking to. */
  #cols { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; flex: 1; }
  .paneHead { display: none; }
  #paneWeb { display: none; }
  body.viewProjects #paneProject, body:not(.viewProjects) #paneOperator { display: none; }


  .msg { max-width: 88%; margin: 0 0 10px; padding: 10px 13px; border-radius: 16px;
         overflow-wrap: break-word; position: relative; }
  .msg.user    { margin-left: auto; background: #2a5db0; border-bottom-right-radius: 5px; }
  .msg.sent    { margin-left: auto; background: #7a4a12; border-bottom-right-radius: 5px; }
  .msg.advisor { margin-right: auto; background: #21272e; border-bottom-left-radius: 5px; }
  .msg.summary { margin-right: auto; background: #17302a; border: 1px solid #2d5c4b;
                 border-bottom-left-radius: 5px; }
  .msg.summary .tag { color: #7fd3ae; opacity: 1; }
  .msg.err     { margin-right: auto; background: #4a1f24; color: #ffb9b9; }
  .msg .tag { display: block; font-size: 11px; opacity: .65; margin-bottom: 3px; }
  .msg pre.code, .amsg pre.code {
    background: #0c0f12; border: 1px solid #2a3138; border-radius: 8px;
    padding: 8px; margin: 6px 0; overflow-x: auto;
    font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre;
  }
  .msg code, .amsg code { background: #0c0f12; border-radius: 4px; padding: 1px 4px;
              font: 13px ui-monospace, Menlo, monospace; }
  .msg b.h, .amsg b.h { display: block; margin: 6px 0 2px; }
  .msg .li, .amsg .li { display: block; padding-left: 6px; }
  .bubbleBtns { display: flex; gap: 8px; margin-top: 8px; }
  .bubbleBtns button {
    padding: 7px 10px; font-size: 13px; background: #10151a;
    border: 1px solid #3a4450; border-radius: 8px;
  }
  .useBtn { color: #ffb464; }
  .sayBtn { color: #8fc7ff; }
  .pending { opacity: .7; }
  .pending::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  footer {
    background: #1b2026; border-top: 1px solid #2a3138;
    padding: 8px 10px 8px;
  }
  /* ---- the tab bar: Agents · Projects · Tickets · Talk ---- */
  nav#tabs {
    display: flex; background: #151a1f; border-top: 1px solid #2a3138;
    padding: 0 4px env(safe-area-inset-bottom); flex: none;
  }
  nav#tabs button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 6px 0 7px; font-size: 11px; color: #7b8894; background: transparent;
    position: relative; min-height: 50px;
  }
  nav#tabs button .ti { font-size: 18px; line-height: 1.2; }
  nav#tabs button.on { color: #8fc7ff; }
  nav#tabs button[hidden] { display: none; }
  .tbadge {
    position: absolute; top: 4px; left: calc(50% + 8px); min-width: 17px; height: 17px;
    border-radius: 9px; background: #ffb464; color: #1b2026; font-size: 11px;
    font-weight: 700; line-height: 17px; padding: 0 4px;
  }
  .tbadge[hidden] { display: none; }
  /* Who the composer is wired to, right above the composer. This is the one
     piece of state you must not have to hunt for: on a wide screen the focused
     column's header is a long way from the mic, and hands-free you aren't
     looking at either. */
  #statusRow { display: flex; align-items: center; gap: 8px; padding: 0 2px 8px; }
  #targetSeg { margin-left: 0; flex: none; max-width: 62%; }
  #targetSeg button {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px;
    font-size: 13px; min-height: 34px; min-width: 0;
  }
  #targetSeg button.on { background: #2a5db0; color: #fff; }
  #targetSeg .dot { width: 8px; height: 8px; }
  #targetProjectName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.noOperator #targetSeg { display: none; }
  /* Which of the project's agents — beside the conversation switch, for the
     same reason: it decides where a send lands. Only there when the project
     has a second agent to choose. */
  #agentSeg { margin-left: 0; flex: none; }
  #agentSeg[hidden] { display: none; }
  #agentSeg button {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px;
    font-size: 13px; min-height: 34px;
  }
  #agentSeg button.on { background: #6a3fb0; color: #fff; }
  #agentSeg .dot { width: 8px; height: 8px; }
  body.viewProjects #agentSeg { display: none; }
  .achip {
    font-size: 10px; padding: 1px 6px; border-radius: 6px; color: #7b8894;
    background: #10151a; border: 1px solid #2a3138;
  }
  .achip.on { color: #7fd3ae; border-color: #2d5c4b; }
  #voiceState {
    font-size: 13px; color: #9fb0c0; display: none; flex: 1; min-width: 0;
    align-items: center; gap: 6px;
  }
  #voiceState.show { display: flex; }
  #voiceState .pulse { width: 9px; height: 9px; border-radius: 50%; background: #e0533f;
                       animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.quick { margin-bottom: 8px; align-items: center; overflow-x: auto;
               -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .row.quick::-webkit-scrollbar { display: none; }
  .quick button.qa {
    background: #10151a; border: 1px solid #2a3138; border-radius: 10px;
    padding: 9px 12px; font-size: 14px; min-height: 42px; white-space: nowrap; flex: none;
  }
  .quick button.qa.on { background: #245036; border-color: #3ecf6f88; color: #d7ffe6; }
  .seg { margin-left: auto; display: flex; background: #10151a;
         border: 1px solid #2a3138; border-radius: 10px; overflow: hidden; flex: none; }
  .seg button { padding: 9px 12px; font-size: 14px; background: transparent; color: #8b98a5; min-height: 42px; }
  .seg button.on { color: #fff; }
  .seg button#destAdvisor.on { background: #2a5db0; }
  .seg button#destProject.on { background: #b06a1c; }
  button#mic {
    min-width: 48px; min-height: 44px; border-radius: 12px; font-size: 20px;
    background: #10151a; border: 1px solid #2a3138; flex: none;
  }
  button#mic.listening { background: #a33327; border-color: #e0533f;
                         animation: pulse 1.1s ease-in-out infinite; }
  textarea#input {
    flex: 1; min-height: 44px; max-height: 150px; resize: none; min-width: 0;
    background: #10151a; color: #e7ecf1; border: 1px solid #2a3138;
    border-radius: 12px; padding: 11px 12px; font: 16px/1.4 inherit;
  }
  body.destProject textarea#input { border-color: #b06a1c; }
  button#send {
    min-width: 70px; min-height: 44px; border-radius: 12px; font-size: 15px;
    font-weight: 600; background: #2a5db0; color: #fff; flex: none;
  }
  body.destProject button#send { background: #b06a1c; }
  button:disabled { opacity: .45; }
  /* ---- multi-project view ---- */
  #viewTitle { flex: 1; font-size: 17px; font-weight: 600; }
  body.viewProjects #project, body.viewProjects #dot,
  body.viewProjects #termRow,
  body.viewProjects #destSeg { display: none; }
  body.viewProject #viewTitle, body:not(.viewProjects) #projects { display: none; }
  #projects {
    background: #0c0f12; border-bottom: 1px solid #2a3138;
    max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #projectsBar {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    font-size: 12px; color: #7b8894; position: sticky; top: 0; background: #0c0f12;
    border-bottom: 1px solid #1c2228;
  }
  #projectsBar .grow { flex: 1; }
  /* On a phone the roster folds to its one-line count so the operator's reply
     gets the screen; tap the bar to unfold it. */
  #projectsFold { display: none; }
  #projectsPinned { display: none; }
  @media (max-width: 1099.98px) {
    #projects { flex: none; }
    #projects.open { max-height: 40vh; display: flex; flex-direction: column; }
    #projects.open > * { flex: none; }
    #projectsBar { order: -1; }
    #projectsUsage { order: 1; }
    #projectsFold { display: inline; color: #9fb0c0; font-size: 11px; margin-right: 2px; }
    #projectsBar { cursor: pointer; user-select: none; -webkit-user-select: none; }
    #projects:not(.open) #projectsUsage, #projects:not(.open) #projectCards,
    #projects:not(.open) #projectsBar button { display: none; }
    #projects:not(.open) #projectsBar { border-bottom: 0; }
    #projects.open #projectsFold { transform: rotate(90deg); display: inline-block; }
    /* Pinned projects as one row of chips, kept when the roster is folded. */
    #projectsPinned:not(:empty) {
      display: flex; gap: 6px; order: -1; padding: 0 12px 7px; overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #projectsPinned::-webkit-scrollbar { display: none; }
    #projectsPinned button {
      flex: none; display: flex; align-items: center; gap: 6px; white-space: nowrap;
      background: #10151a; border: 1px solid #2a3138; border-radius: 14px;
      color: #c9d4dd; font-size: 13px; padding: 4px 10px; min-height: 30px;
    }
    #projectsPinned .dot { width: 8px; height: 8px; }
    #projects:not(.open) #projectsPinned { border-bottom: 1px solid #1c2228; }
  }
  #projectsBar button {
    background: #10151a; border: 1px solid #2a3138; border-radius: 8px;
    color: #9fb0c0; font-size: 12px; padding: 5px 10px; min-height: 30px;
  }
  .pcard {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-bottom: 1px solid #171d23;
  }
  .pcard.sel { background: #121a22; }
  .psel {
    width: 26px; height: 26px; flex: none; border-radius: 7px; font-size: 14px;
    background: #10151a; border: 1px solid #2a3138; color: transparent;
    line-height: 1;
  }
  .pcard.sel .psel { background: #2a5db0; border-color: #2a5db0; color: #fff; }
  .pmain { flex: 1; min-width: 0; }
  .pname { font-size: 15px; display: flex; align-items: center; gap: 7px; }
  .pmeta {
    font-size: 11px; color: #7b8894; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pmeta.busy { color: #ffb464; }
  .pdive {
    flex: none; background: #10151a; border: 1px solid #3a4450; border-radius: 9px;
    padding: 8px 11px; font-size: 13px; color: #8fc7ff; min-height: 38px;
  }
  .msg.summary .tag.proj { color: #ffb464; }
  /* ---- selected-project tiles (second column) ---- */
  #tiles {
    display: none; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 7px; padding: 8px 10px; background: #0c0f12;
    border-bottom: 1px solid #2a3138; max-height: 32vh; overflow-y: auto;
  }
  .tile {
    text-align: left; background: #10151a; border: 1px solid #2a3138;
    border-radius: 10px; padding: 8px 9px; min-height: 52px;
  }
  .tile.on { border-color: #2a5db0; background: #16202e; }
  .tile .tname {
    font-size: 13px; display: flex; align-items: center; gap: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile .tmeta { font-size: 10px; color: #7b8894; margin-top: 3px; }
  .tile .tmeta.busy { color: #ffb464; }
  #tilesEmpty { grid-column: 1 / -1; font-size: 12px; color: #7b8894; padding: 4px 2px; }
  /* ---- third column: the project's own web app ---- */
  #webBody { flex: 1; min-height: 0; position: relative; background: #0c0f12; }
  #webFrame { width: 100%; height: 100%; border: 0; display: none; background: #fff; }
  #webFrame.show { display: block; }
  #webNote {
    position: absolute; inset: 0; overflow-y: auto; padding: 18px;
    font-size: 13px; color: #9fb0c0; line-height: 1.6;
  }
  #webNote code { background: #10151a; border-radius: 4px; padding: 1px 5px;
                  font: 12px ui-monospace, Menlo, monospace; }
  #webNote a { color: #8fc7ff; }
  #webTabs { display: flex; gap: 4px; }
  #webTabs button {
    background: #10151a; border: 1px solid #2a3138; border-radius: 7px;
    color: #9fb0c0; font-size: 11px; padding: 4px 7px; min-height: 26px;
  }
  #webTabs button.on { background: #2a5db0; border-color: #2a5db0; color: #fff; }
  /* ---- the list views: Agents, Projects, Tickets ---- */
  .listview {
    display: none; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 12px 16px;
  }
  body.viewHome #home, body.viewRepos #repos, body.viewTickets #tickets { display: block; }
  /* No composer, chat or project picker on a list; those are Talk's. */
  body.viewList #cols, body.viewList footer, body.viewList #project, body.viewList #dot,
  body.viewList #newchat, body.viewList #controls { display: none; }
  /* Without the voice feature there is no Talk at all. */
  body.noVoice #tabTalk, body.noVoice #settingsBtn, body.noVoice #controls,
  body.noVoice #newchat, body.noVoice .needsVoice { display: none; }
  body.noJira #tabTickets { display: none; }
  #homeInner, #reposInner, #ticketsInner { max-width: 1100px; margin: 0 auto; }
  .hsec {
    font-size: 12px; color: #7b8894; text-transform: uppercase; letter-spacing: .04em;
    margin: 12px 2px 6px; user-select: none; -webkit-user-select: none;
  }
  details > summary.hsec { cursor: pointer; }
  .hnote { font-size: 13px; color: #7b8894; padding: 2px 2px 4px; }
  /* The CPU reservation queue (reserve/), under the Agents view. */
  .cpu { background: #1b2026; border: 1px solid #2a3138; border-radius: 12px; padding: 8px 12px;
         margin-bottom: 4px; }
  .cpu > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
                   font-size: 13px; color: #cfd8e1; }
  .cpu > summary::-webkit-details-marker { display: none; }
  .cpu .cbar { flex: 1; display: flex; height: 8px; border-radius: 4px; overflow: hidden;
               background: #2a3138; min-width: 60px; }
  .cpu .cbar span { background: #3ecf6f; border-right: 2px solid #1b2026; }
  .cpu .cbar span.stop { background: #e0533f; }
  .cpu .cnum { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cpu .cwait { color: #ffb464; white-space: nowrap; }
  .cpu .cpaused { color: #ffb464; font-weight: 600; }
  .cpu .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0 2px; }
  .cpu .ctl .n { min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; }
  .cpu .csec { font-size: 10px; color: #7b8894; text-transform: uppercase; letter-spacing: .04em;
               margin: 10px 0 2px; }
  .cpu .crow { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0;
               border-top: 1px solid #2a3138; font-size: 13px; }
  .cpu .crow:first-of-type { border-top: 0; }
  .cpu .ccores { width: 4.6em; flex: none; font-weight: 600; font-variant-numeric: tabular-nums;
                 white-space: nowrap; }
  .cpu .run .ccores { color: #3ecf6f; } .cpu .wait .ccores { color: #ffb464; }
  .cpu .hist .ccores { color: #7b8894; font-weight: 400; }
  /* On a phone a waiter's buttons wrap under it rather than squeeze it. */
  .cpu .cwhat { flex: 1 1 200px; min-width: 0; }
  .cpu .cbtns { display: flex; gap: 6px; margin-left: auto; }
  .cpu .cwhat div { color: #7b8894; font-size: 12px; overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; }
  .cpu button { padding: 5px 9px; min-height: 32px; font-size: 12px; color: #cfd8e1; flex: none;
                background: #10151a; border: 1px solid #3a4450; border-radius: 8px; }
  .cpu button.x { color: #ffb9b9; }
  .ameta .cq { color: #ffb464; } .ameta .ch { color: #3ecf6f; }
  .hgrid {
    display: grid; gap: 8px; align-items: start;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
  }
  .acard {
    background: #1b2026; border: 1px solid #2a3138; border-left: 4px solid #3a4450;
    border-radius: 12px; padding: 10px 12px; min-width: 0;
  }
  .acard.st-needs_input { border-left-color: #ffb464; }
  .acard.st-completed { border-left-color: #3ecf6f; }
  .acard.st-error { border-left-color: #e0533f; }
  .acard.st-new { border-left-color: #b07fe0; }
  .acard.st-working, .acard.st-starting { border-left-color: #2a5db0; }
  .ahead { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .apill {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; flex: none;
    background: #10151a; color: #9fb0c0; white-space: nowrap;
  }
  .st-needs_input .apill { background: #4a3315; color: #ffd29a; }
  .st-completed .apill { background: #17302a; color: #9fe8c4; }
  .st-error .apill { background: #4a1f24; color: #ffb9b9; }
  .st-new .apill { background: #2e2140; color: #d9bff5; }
  .st-working .apill, .st-starting .apill { background: #16263f; color: #a9cdf5; }
  .st-working .apill::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: 5px; vertical-align: 1px;
    animation: pulse 1.1s ease-in-out infinite;
  }
  .aname {
    font-size: 15px; font-weight: 600; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .atime { margin-left: auto; font-size: 12px; color: #7b8894; flex: none; }
  .ameta { font-size: 11px; color: #7b8894; margin-top: 3px; }
  .asum { font-size: 14px; margin-top: 6px; overflow-wrap: anywhere; }
  .asum.old { color: #9fb0c0; }
  .alabel {
    display: block; font-size: 10px; color: #7b8894; margin-bottom: 1px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .ahint { font-size: 12px; color: #c9a0ff; margin-top: 4px; }
  .abtns { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .abtns button, .abtns a {
    padding: 7px 11px; min-height: 36px; font-size: 13px; color: #cfd8e1;
    background: #10151a; border: 1px solid #3a4450; border-radius: 9px;
  }
  .abtns a { color: #8fc7ff; text-decoration: none; display: inline-flex; align-items: center;
             box-sizing: border-box; }
  .abtns button.voice { color: #8fc7ff; }
  .abtns button.dismiss { color: #9fe8c4; }
  .abtns button.pin { padding-left: 8px; padding-right: 8px; filter: grayscale(1); opacity: .5; }
  .abtns button.pin.on { filter: none; opacity: 1; }
  .rpin { background: none; border: 0; padding: 4px 6px; font-size: 14px; cursor: pointer;
          filter: grayscale(1); opacity: .35; }
  .rpin.on { filter: none; opacity: 1; }
  /* Idle agents: one row each, so a long tail of them stays a short list. */
  .acard.quiet { padding: 7px 10px 7px 12px; }
  .quiet .ahead .abtns { margin: 0 0 0 auto; flex-wrap: nowrap; flex: none; }
  .ahead .achip, .abtns button, .abtns a { flex: none; white-space: nowrap; }
  .quiet .abtns button, .quiet .abtns a { min-height: 32px; padding: 5px 9px; }
  .quiet .asum { font-size: 12px; margin-top: 3px; color: #9fb0c0;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quiet .asum .alabel { display: inline; margin-right: 6px; }
  .adetail { margin-top: 9px; border-top: 1px solid #2a3138; padding-top: 8px; }
  .adetail[hidden] { display: none; }
  .amsg {
    font-size: 14px; max-height: 55vh; overflow-y: auto; overflow-wrap: anywhere;
    -webkit-overflow-scrolling: touch;
  }
  .apath { font: 11px/1.4 ui-monospace, Menlo, monospace; color: #9fb0c0;
           overflow-wrap: anywhere; margin-top: 8px; }
  .adetail pre.term {
    margin: 8px 0 0; padding: 8px; max-height: 45vh; overflow: auto;
    background: #0c0f12; border: 1px solid #2a3138; border-radius: 8px;
    font: 10px/1.35 ui-monospace, "SF Mono", Menlo, monospace; color: #c9d4dd;
    white-space: pre; -webkit-overflow-scrolling: touch;
  }
  /* ---- Projects: grouped by repository ---- */
  #repoFilterWrap { position: relative; margin: 8px 0 2px; }
  #repoFilter {
    width: 100%; font-size: 16px; padding: 9px 40px 9px 12px;
    background: #10151a; color: #e7ecf1; border: 1px solid #2a3138; border-radius: 10px;
  }
  #repoFilter::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  #repoFilterClear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px;
    background: none; color: #7b8894; font-size: 20px; line-height: 1; cursor: pointer;
  }
  #repoFilterClear:hover { color: #e7ecf1; }
  #repoFilterClear[hidden] { display: none; }
  .rsec { display: flex; align-items: baseline; gap: 8px; }
  .rsec .rpath { font-size: 11px; color: #56616c; text-transform: none; letter-spacing: 0;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcard { border-left-color: #2a3138; }
  .rcard.live { border-left-color: #3ecf6f; }
  .rgit { font-size: 12px; color: #9fb0c0; margin-top: 3px; overflow-wrap: anywhere; }
  .rgit .wt { color: #c9a0ff; }
  .rdesc { font-size: 12px; color: #7b8894; margin-top: 2px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  a.tchip, span.tchip {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px;
    background: #1d2433; border: 1px solid #2f3a52; color: #a9c4f5; text-decoration: none;
  }
  .ragents { display: grid; gap: 6px; margin-top: 8px; }
  .ragent { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .ragent .rname { font-size: 13px; min-width: 64px; display: flex; align-items: center; gap: 6px; }
  .ragent .rname .dot { width: 8px; height: 8px; }
  .ragent button, .rweb {
    padding: 5px 10px; min-height: 32px; font-size: 13px; color: #cfd8e1;
    background: #10151a; border: 1px solid #3a4450; border-radius: 9px; text-decoration: none;
    display: inline-flex; align-items: center;
  }
  .ragent button.start { color: #9fe8c4; }
  .ragent button.stop { color: #ffb9b9; margin-left: auto; }
  .rweb { margin-left: auto; color: #8fc7ff; }
  /* ---- Projects as an accordion, each with a live terminal ---- */
  .rlist { display: grid; gap: 6px; }
  .rcard { padding: 0; }
  .rtop { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; cursor: pointer;
          user-select: none; -webkit-user-select: none; }
  .rtop .aname { flex: 1; }
  .rtop .chev { color: #7b8894; font-size: 13px; width: 14px; text-align: center; flex: none; }
  .rcard:not(.open) .rtop { padding-bottom: 10px; }
  .rsub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 0 12px 9px 31px;
          margin-top: -4px; }
  .rsub .rgit { margin: 0; }
  .rcard.open .rdesc, .rcard.open > .ameta { padding: 0 12px; }
  .rcard.open { border-left-color: #8fc7ff; }
  .rbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px 8px; flex-wrap: wrap; }
  .rbar .grow { flex: 1; }
  .aseg { margin-left: 0; }
  /* In a card the toggle has the row to itself; the actions sit under it,
     Stop off to the right where it isn't hit by accident. */
  .rbar .aseg { flex: 0 0 100%; }
  .rbar .aseg button { flex: 1; justify-content: center; }
  .rbar .grow { display: none; }
  .rbar .ract.stop { margin-left: auto; }
  .aseg button { display: flex; align-items: center; gap: 6px; padding: 6px 11px; min-height: 34px; font-size: 13px; }
  .aseg button.on { background: #6a3fb0; color: #fff; }
  .aseg .dot { width: 8px; height: 8px; }
  .ract { padding: 6px 11px; min-height: 34px; font-size: 13px; color: #cfd8e1;
          background: #10151a; border: 1px solid #3a4450; border-radius: 9px; }
  .ract.start { color: #9fe8c4; }
  .ract.stop { color: #ffb9b9; }
  .ract.term { color: #8fc7ff; }
  .rnote { font-size: 13px; color: #7b8894; padding: 0 12px 10px; }
  /* ---- the full-screen terminal ---- */
  #termView {
    position: fixed; left: 0; right: 0; top: 0; height: 100dvh; z-index: 25;
    background: #0b0e14; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  #termView[hidden] { display: none; }
  #termBar {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; flex: none;
    background: #151a1f; border-bottom: 1px solid #2a3138;
  }
  #termClose { min-width: 40px; min-height: 36px; font-size: 24px; line-height: 1;
               background: #10151a; border: 1px solid #2a3138; border-radius: 9px; }
  #termTitle { flex: 1; min-width: 0; font-weight: 600; font-size: 15px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #termHost { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #termHost .tnote { margin: auto; text-align: center; color: #9fb0c0; font-size: 14px; }
  #termHost .tnote button { margin-top: 10px; }
  .lterm { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .lscreen { flex: 1; min-height: 0; padding: 3px 0 0 3px; touch-action: none; }
  .lkeys { padding-bottom: calc(5px + env(safe-area-inset-bottom)) !important; }
  .lnote { position: absolute; left: 50%; top: 40%; transform: translateX(-50%);
           background: #1b2026ee; border: 1px solid #3a4450; border-radius: 10px;
           padding: 8px 14px; font-size: 13px; color: #cfd8e1; cursor: pointer; max-width: 90%; }
  .lnote[hidden] { display: none; }
  .lkeys { display: flex; gap: 4px; padding: 5px; background: #151a1f; border-top: 1px solid #2a3138;
           overflow-x: auto; scrollbar-width: none; }
  .lkeys[hidden] { display: none; }
  .lkeys button { flex: 1 0 auto; min-width: 38px; min-height: 36px; font-size: 13px;
                  color: #cfd8e1; background: #10151a; border: 1px solid #2a3138; border-radius: 8px; }
  .lkeys button.wide { flex-grow: 2; }
  .lkeys button.on { background: #2a5db0; color: #fff; }
  /* ---- Tickets ---- */
  .tcard.cat-indeterminate { border-left-color: #2a5db0; }
  .tcard.cat-new { border-left-color: #56616c; }
  .tcard.cat-done { border-left-color: #3ecf6f; }
  .tcard .apill { background: #10151a; color: #9fb0c0; }
  .tcard.cat-indeterminate .apill { background: #16263f; color: #a9cdf5; }
  .tcard.cat-done .apill { background: #17302a; color: #9fe8c4; }
  .tdesc { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; color: #cfd8e1;
           max-height: 50vh; overflow-y: auto; }
  .tcomment { margin-top: 8px; padding-top: 6px; border-top: 1px solid #222930; font-size: 13px;
              white-space: pre-wrap; overflow-wrap: anywhere; }
  .tcomment .alabel { margin-bottom: 2px; }
  /* ---- service quota & remaining credits strip ---- */
  .ugrid {
    display: grid; gap: 8px; margin: 6px 0 10px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  }
  #projectsUsage .ugrid {
    margin: 0; padding: 8px 10px; background: #0c0f12;
    border-bottom: 1px solid #2a3138; grid-template-columns: 1fr;
  }
  .ucard {
    background: #161b21; border: 1px solid #2a3138; border-radius: 11px;
    padding: 9px 11px; min-width: 0;
  }
  .uhead {
    display: flex; align-items: center; gap: 7px; font-size: 13px;
    font-weight: 600; margin-bottom: 6px; flex-wrap: wrap;
  }
  .uhead .uname { color: #e7ecf1; }
  .ucred {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px;
    background: #10151a; border: 1px solid #2a3138; color: #9fe8c4;
    margin-left: auto; white-space: nowrap;
  }
  .ucred.warn { color: #ffd29a; border-color: #5c3f18; background: #2c2011; }
  .ucred.low  { color: #ffb9b9; border-color: #5c2329; background: #2c1417; }
  .uref {
    background: #10151a; border: 1px solid #2a3138; border-radius: 6px;
    color: #9fb0c0; font-size: 12px; padding: 2px 7px; min-height: 24px;
  }
  .ubars { display: grid; gap: 5px; }
  .urow {
    display: grid; grid-template-columns: 5.8rem 1fr auto; gap: 7px;
    align-items: center; font-size: 11px;
  }
  .ulbl { color: #9fb0c0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ubar {
    height: 7px; background: #0c0f12; border: 1px solid #252c34;
    border-radius: 999px; overflow: hidden;
  }
  .ufill { height: 100%; background: #3ecf6f; border-radius: 999px; }
  .ufill.warn { background: #ffb464; }
  .ufill.low  { background: #e0533f; }
  .uval {
    color: #cfd8e1; font-variant-numeric: tabular-nums; white-space: nowrap;
    text-align: right;
  }
  .uval .ureset { color: #7b8894; margin-left: 4px; }
  .ufoot {
    font-size: 11px; color: #7b8894; margin-top: 6px;
    display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap;
  }
  .uchip {
    font-size: 11px; color: #9fb0c0; background: #10151a;
    border: 1px solid #2a3138; border-radius: 6px; padding: 1px 6px;
    white-space: nowrap; flex: none;
  }
  #sheet {
    position: fixed; inset: 0; z-index: 30; background: #000a;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  #sheet[hidden] { display: none; }
  .sheetBox {
    width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto;
    background: #1b2026; border: 1px solid #2a3138; border-radius: 16px;
    padding: 14px 14px 12px;
  }
  .sheetBox h2 { font-size: 16px; margin-bottom: 10px; }
  .sheetBox label {
    display: block; font-size: 12px; color: #7b8894; margin: 12px 0 5px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .sheetBox .seg { margin-left: 0; width: 100%; }
  .sheetBox .seg button { flex: 1; min-width: 0; }
  .sheetBox .seg button.on { background: #2a5db0; color: #fff; }
  .sheetBox .seg button:disabled { opacity: .35; }
  .sheetBox select {
    width: 100%; font-size: 16px; padding: 10px; background: #10151a;
    color: #e7ecf1; border: 1px solid #2a3138; border-radius: 10px;
  }
  .sheetBox .hint { font-size: 12px; color: #7b8894; margin-top: 6px; }
  .sheetBox .hint.warn { color: #ffb464; }
  .sheetBtns { display: flex; gap: 8px; margin-top: 16px; }
  .sheetBtns button {
    flex: 1; min-height: 44px; border-radius: 10px; font-size: 15px;
    background: #10151a; border: 1px solid #3a4450;
  }
  .sheetBtns button#sheetClose { background: #2a5db0; border-color: #2a5db0; font-weight: 600; }
  #toast {
    position: fixed; left: 12px; right: 12px; bottom: 130px; z-index: 20;
    background: #2b3340; color: #fff; border: 1px solid #3a4450;
    padding: 10px 14px; border-radius: 12px; font-size: 14px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #toast.show { opacity: 1; }

  /* Responsive overrides last: these must beat the base rules above. */
  @media (min-width: 1100px) {
    #cols { flex-direction: row; }
    /* All three stay up; .focus marks the one the composer is wired to. */
    body.viewProjects #paneProject, body:not(.viewProjects) #paneOperator { display: flex; }
    #paneOperator { flex: 0 0 330px; border-right: 1px solid #2a3138; }
    #paneProject  { flex: 1 1 0; border-right: 1px solid #2a3138; }
    #paneWeb      { flex: 1.25 1 0; display: flex; }
    .paneHead {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      background: #151a1f; border-bottom: 1px solid #2a3138;
      font-size: 12px; color: #7b8894; min-height: 34px;
    }
    .paneHead .grow { flex: 1; min-width: 0; overflow: hidden;
                      text-overflow: ellipsis; white-space: nowrap; }
    .paneHead button {
      background: #10151a; border: 1px solid #2a3138; border-radius: 7px;
      color: #9fb0c0; font-size: 12px; padding: 4px 8px; min-height: 26px;
    }
    .pane.focus > .paneHead { background: #1d2b44; color: #cfe0f5; }
    .pane.focus > .paneHead .grow { font-weight: 600; }
    /* The roster is the phone's projects view; on a desktop the tiles are the
       surface and unselected projects stay out of the way until asked for. */
    #projects { max-height: none; flex: 0 1 auto; }
    body.wideRoster #projects { display: block; }
    body:not(.wideRoster) #projects { display: none; }
    #tiles { display: grid; }
    .msg { max-width: 94%; }
  }
</style>
</head>
<body>

<header>
  <span id="viewTitle">Agents</span>
  <select id="project"></select>
  <span id="dot" class="dot"></span>
  <button id="refresh" class="icon" title="Reload the page">&#10227;</button>
  <button id="newchat" class="icon" title="New advisor chat">&#129529;</button>
  <button id="settingsBtn" class="icon" title="Voice settings">&#9881;</button>
</header>

<div id="controls">
  <button id="musicBtn" title="Play / pause music" style="display:none">&#9654;</button>
  <span id="musicLabel" title="Tap for the next mix" style="display:none">music for programming</span>
  <div id="listenPause" title="How long a pause ends your turn">
    <span>pause</span>
    <button data-pause="short">short</button>
    <button data-pause="normal">normal</button>
    <button data-pause="long">long</button>
  </div>
  <div id="ttsSpeed" title="Spoken reply speed">
    <button data-rate="slow">0.8&times;</button>
    <button data-rate="medium">1&times;</button>
    <button data-rate="fast">1.2&times;</button>
  </div>
</div>

<section id="home" class="listview"><div id="homeInner"></div></section>
<section id="repos" class="listview">
  <div id="reposInner">
    <div id="repoFilterWrap">
      <input id="repoFilter" type="search" placeholder="Filter projects" autocomplete="off">
      <button id="repoFilterClear" type="button" title="Clear filter" aria-label="Clear filter" hidden>&times;</button>
    </div>
    <div id="reposList"></div>
  </div>
</section>
<section id="tickets" class="listview"><div id="ticketsInner"></div></section>

<div id="cols">

  <section id="paneOperator" class="pane">
    <div class="paneHead">
      <span class="grow">&#9776; Operator</span>
      <button id="clearOperator" title="New chat with the operator">&#129529;</button>
    </div>
    <section id="projects">
      <div id="projectsUsage"></div>
      <div id="projectsBar">
        <span id="projectsFold">&#9656;</span>
        <span class="grow" id="projectsCount">&nbsp;</span>
        <button id="selAll">All</button>
        <button id="selNone">None</button>
      </div>
      <div id="projectsPinned"></div>
      <div id="projectCards"></div>
    </section>
    <main id="chatOperator" class="chat"></main>
  </section>

  <section id="paneProject" class="pane">
    <div class="paneHead">
      <span class="grow" id="paneProjectName">project</span>
      <button id="rosterToggle" title="Show every project">All&hellip;</button>
      <button id="clearProject">&#129529;</button>
    </div>
    <div id="tiles"></div>
    <button id="termRow" title="Open the live terminal">Terminal &#10530;</button>
    <main id="chatProject" class="chat"></main>
  </section>

  <section id="paneWeb" class="pane">
    <div class="paneHead">
      <span class="grow" id="webTitle">&nbsp;</span>
      <span id="webTabs"></span>
      <button id="webReload" title="Reload">&#10227;</button>
      <button id="webOpen" title="Open in a new tab">&#8599;</button>
    </div>
    <div id="webBody">
      <iframe id="webFrame" referrerpolicy="no-referrer"
              sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
      <div id="webNote"></div>
    </div>
  </section>

</div>

<footer>
  <div id="statusRow">
    <div class="seg" id="targetSeg">
      <button id="targetOperator">&#9776; Operator</button>
      <button id="targetProject"><span class="dot" id="targetDot"></span><span
              id="targetProjectName">project</span></button>
    </div>
    <div class="seg" id="agentSeg" hidden></div>
    <div id="voiceState"><span class="pulse"></span><span id="voiceStateText"></span></div>
  </div>
  <div class="row quick">
    <button id="btnStatus" class="qa">&#128202; Status</button>
    <button id="btnBrainstorm" class="qa">&#128161; Brainstorm</button>
    <button id="btnSpeak" class="qa" title="Read replies aloud">&#128266; Speak</button>
    <button id="btnConvo" class="qa" title="Hands-free: reopen the mic after each reply">&#127908; Convo</button>
    <div class="seg" id="destSeg">
      <button id="destAdvisor" class="on">Sonnet</button>
      <button id="destProject">Project</button>
    </div>
  </div>
  <div class="row">
    <button id="mic" title="Push to talk">&#127908;</button>
    <textarea id="input" rows="1" placeholder="Dictate or type&hellip;"></textarea>
    <button id="send">Ask</button>
  </div>
</footer>

<nav id="tabs">
  <button data-tab="home"><span class="ti">&#9673;</span>Agents<span class="tbadge" id="needBadge" hidden></span></button>
  <button data-tab="repos"><span class="ti">&#9638;</span>Projects</button>
  <button data-tab="tickets" id="tabTickets"><span class="ti">&#9744;</span>Tickets</button>
  <button data-tab="talk" id="tabTalk"><span class="ti">&#127908;</span>Talk</button>
</nav>

<!-- The terminal, full screen: a terminal squeezed into a card is no use. -->
<div id="termView" hidden>
  <div id="termBar">
    <button id="termClose" title="Back">&#8249;</button>
    <span id="termTitle"></span>
    <div class="seg aseg" id="termAgents"></div>
  </div>
  <div id="termHost"></div>
</div>

<div id="sheet" hidden>
  <div class="sheetBox">
    <h2>Voice</h2>

    <label>Speech input</label>
    <div class="seg" id="sttSeg">
      <button data-mode="auto">Auto</button>
      <button data-mode="browser">Browser</button>
      <button data-mode="server">Local server</button>
    </div>
    <p class="hint" id="sttHint"></p>

    <label>Spoken replies</label>
    <div class="seg" id="ttsSeg">
      <button data-engine="browser">Browser</button>
      <button data-engine="kokoro">Kokoro</button>
    </div>
    <p class="hint" id="ttsHint"></p>

    <label>Voice</label>
    <select id="voiceSel"></select>

    <div id="musicOpt">
      <label>Background music</label>
      <div class="seg" id="musicSeg">
        <button data-on="0">Off</button>
        <button data-on="1">On</button>
      </div>
      <p class="hint">Mixes from musicforprogramming.net while you work in Talk;
        they pause when a summary is read out.</p>
    </div>

    <div class="sheetBtns">
      <button id="voiceTest">&#9654; Test</button>
      <button id="sheetClose">Done</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let projects = [], current = null, dest = 'advisor', busy = false;
/* Two views over the same chat furniture. 'project' is one project and its
   advisor; 'projects' is every selected project at once and the operator that
   watches them. The mic, Speak and Convo don't know the difference — whichever
   conversation is on screen is the one they talk to. */
let view = 'project', operatorOn = false, OPERATOR = '@operator';
let ovTimer = null, lastOverviewTs = 0;
let webTargets = [], webIndex = 0;

   back to whatever speech the browser has of its own — which on Firefox is
   synthesis only, and on Firefox/Linux means espeak voices. */
let serverSTT = false, serverTTS = false, defaultKokoroVoice = 'af_heart';
let kokoroVoices = [], kokoroErr = '', metaReady = null;
let terminalWeb = null;   // the browser terminal's address, from /api/meta
/* What this server offers, from /api/meta. Without the voice feature there is
   no Talk tab: the page is Agents, Projects and Tickets. */
let voiceOn = true, jiraOn = false, jiraUrl = '', usageOn = false;
let DEFAULT_AGENT = 'claude';

/* ---------- api ---------- */
const RETRY_ATTEMPTS = 3, RETRY_DELAY = 1000;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* One attempt. Failures carry .retryable / .network so api() can decide. */
async function apiOnce(path, opts) {
  let r;
  try {
    r = await fetch(path, opts);
  } catch (e) {
    const err = new Error('network error — ' + (e.message || 'request failed'));
    err.network = true;
    throw err;
  }
  if (r.status === 401) {
    const t = prompt('Access token:');
    if (!t) throw new Error('unauthorized');
    localStorage.setItem('vp.token', t);
    opts.headers['X-VP-Token'] = t;
    return apiOnce(path, opts);
  }
  const data = await r.json().catch(() => ({ error: 'bad response from server' }));
  if (!r.ok) {
    const err = new Error(data.error || ('HTTP ' + r.status));
    // A 4xx is the server's considered answer — it won't differ in a second.
    err.retryable = r.status >= 500 || r.status === 408 || r.status === 429;
    throw err;
  }
  return data;
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers);
  const tok = localStorage.getItem('vp.token');
  if (tok) opts.headers['X-VP-Token'] = tok;
  if (opts.body && typeof opts.body !== 'string' && !(opts.body instanceof Blob)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
    opts.method = opts.method || 'POST';
  }
  // A dropped connection never says whether the server already acted, so only
  // replay requests that change nothing. /api/send is off limits either way:
  // repeating it could type the same prompt into the agent twice, which is
  // worse than making you tap Send again.
  const isGet = !opts.method || opts.method === 'GET';
  const mayRetry = path.split('?')[0] !== '/api/send';
  for (let attempt = 1; ; attempt++) {
    try {
      return await apiOnce(path, opts);
    } catch (e) {
      const worthRetrying = mayRetry && (e.retryable || (e.network && isGet));
      if (!worthRetrying || attempt >= RETRY_ATTEMPTS) throw e;
      await sleep(RETRY_DELAY);
    }
  }
}

function authHeaders() {
  const tok = localStorage.getItem('vp.token');
  return tok ? { 'X-VP-Token': tok } : {};
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 4500);
}

/* ---------- tiny markdown ---------- */
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function md(t) {
  const parts = t.split('```');
  let html = '';
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      let c = parts[i];
      const nl = c.indexOf('\n');
      if (nl > -1 && /^[\w+.-]*\s*$/.test(c.slice(0, nl))) c = c.slice(nl + 1);
      html += '<pre class="code">' + esc(c.replace(/\n$/, '')) + '</pre>';
    } else {
      html += parts[i].split('\n').map(l => {
        if (/^#{1,4}\s/.test(l)) return '<b class="h">' + inline(l.replace(/^#+\s*/, '')) + '</b>';
        if (/^\s*[-*]\s+/.test(l)) return '<span class="li">&bull;&nbsp;' + inline(l.replace(/^\s*[-*]\s+/, '')) + '</span>';
        return inline(l);
      }).join('<br>').replace(/(<\/span>)<br>/g, '$1').replace(/(<\/b>)<br>/g, '$1');
    }
  }
  return html;
}
function lastCodeBlock(t) {
  const m = t.match(/```[^\n]*\n([\s\S]*?)```/g);
  if (!m) return null;
  return m[m.length - 1].replace(/^```[^\n]*\n/, '').replace(/```$/, '').trim();
}

/* ---------- text-to-speech ---------- */
const TTS_RATES = { slow: 0.8, medium: 1.0, fast: 1.2 };
let ttsRate = localStorage.getItem('vp.ttsRate');
if (TTS_RATES[ttsRate] === undefined) ttsRate = 'fast';

/* The speed lives on the server, so the operator's set_speech_speed and these
   buttons are one setting. localStorage only paints the buttons before
   /api/meta answers; a reply carries the server's current rate. */
function setTtsRate(name, save) {
  if (TTS_RATES[name] === undefined) return;
  ttsRate = name;
  localStorage.setItem('vp.ttsRate', name);
  for (const b of $('ttsSpeed').children) b.classList.toggle('on', b.dataset.rate === name);
  if (save) api('/api/tts/rate', { body: { rate: name } }).catch(e => toast(e.message));
}
for (const b of $('ttsSpeed').children) {
  b.onclick = () => { unlockTTS(); setTtsRate(b.dataset.rate, true); };
}

let speakOn = localStorage.getItem('vp.speak') === '1';
let handsFree = false;
let ttsActive = false;
let ttsVoice = null;          // browser engine: the SpeechSynthesisVoice in use
let ttsUnlocked = false;
let ttsGen = 0;               // bumped by stopSpeaking; stale playback checks it
let ttsAudio = null;          // the one <audio> element the Kokoro path plays through
let clipDone = null;          // resolver for the clip playing right now
let silentUrl = null;
let ttsEngine = localStorage.getItem('vp.ttsEngine') || 'browser';

/* Which engine actually speaks. Kokoro is only honoured once the server says
   it has a TTS endpoint, so a config that drops it falls back to the browser
   rather than going quiet. */
function ttsEngineNow() {
  return (ttsEngine === 'kokoro' && serverTTS) ? 'kokoro' : 'browser';
}
function kokoroVoice() {
  return localStorage.getItem('vp.voice.kokoro') || defaultKokoroVoice;
}

/* Pick the engine for a browser that hasn't been told which to use. A browser
   with no voices installed — Firefox without speech-dispatcher — would
   otherwise just say nothing, which reads as broken rather than as a setting.
   Only ever a default: the moment ⚙ is used, that choice is saved and wins.
   Re-run as voices arrive, since Chrome fills its list asynchronously. */
function defaultTtsEngine() {
  if (localStorage.getItem('vp.ttsEngine')) return;
  const voices = ('speechSynthesis' in window) ? speechSynthesis.getVoices().length : 0;
  ttsEngine = (serverTTS && !voices) ? 'kokoro' : 'browser';
}

/* A saved pick wins; otherwise iOS's good voices, then any local English one —
   on Linux that lands on espeak, which is the reason Kokoro is worth having. */
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  const want = localStorage.getItem('vp.voice.browser');
  ttsVoice =
    (want && vs.find(v => v.voiceURI === want)) ||
    vs.find(v => /^en/.test(v.lang) && /Samantha|Siri|Ava|Zoe/i.test(v.name)) ||
    vs.find(v => /^en/.test(v.lang) && v.localService) ||
    vs.find(v => /^en/.test(v.lang)) || null;
  defaultTtsEngine();
  if (!$('sheet').hidden) fillVoices();   // Chrome fills the list asynchronously
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}

function audioEl() {
  if (!ttsAudio) { ttsAudio = new Audio(); ttsAudio.preload = 'auto'; }
  return ttsAudio;
}
/* Both engines are gated on a user gesture by iOS, and the Kokoro one can't
   satisfy that when the moment comes: its first clip arrives from a fetch,
   long after the tap. So spend the tap now, on a tenth of a second of silence. */
function unlockTTS() {
  if (ttsUnlocked) return;
  ttsUnlocked = true;
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }
  try {
    if (!silentUrl) silentUrl = URL.createObjectURL(wavBlob(new Float32Array(1600), 16000));
    const el = audioEl();
    el.src = silentUrl;
    el.play().catch(() => {});
  } catch (e) {}
}

function speakable(t) {
  return t
    .replace(/```[\s\S]*?```/g, ' Code block omitted. ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\*\*/g, '')
    .replace(/^#+\s*/gm, '')
    .replace(/^\s*[-*]\s+/gm, '')
    .replace(/\s+/g, ' ').trim();
}

/* Sentence groups <= ~230 chars. iOS truncates long utterances, and short
   chunks are also what lets Kokoro start talking before the whole reply has
   been synthesized. */
function speakChunks(t) {
  const sentences = t.match(/[^.!?]+[.!?]*\s*/g) || [t];
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if ((cur + s).length > 230 && cur) { chunks.push(cur); cur = s; }
    else cur += s;
  }
  if (cur.trim()) chunks.push(cur);
  return chunks;
}

function speakText(raw) {
  const t = speakable(raw);
  if (!t) return Promise.resolve();
  const chunks = speakChunks(t);
  const gen = ttsGen;
  ttsActive = true;
  setVoiceState('speaking');
  const play = ttsEngineNow() === 'kokoro' ? speakKokoro : speakBrowser;
  return play(chunks, gen).then(() => {
    if (gen !== ttsGen) return;         // stopSpeaking already cleared the state
    ttsActive = false;
    if (voiceStateIs('speaking')) setVoiceState(null);
  });
}

function speakBrowser(chunks, gen) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) {
      toast('This browser has no speech synthesis' +
            (serverTTS ? ' — switch spoken replies to Kokoro in \u2699.' : '.'));
      return resolve();
    }
    let i = 0;
    const next = () => {
      if (gen !== ttsGen || i >= chunks.length) return resolve();
      const u = new SpeechSynthesisUtterance(chunks[i++]);
      if (ttsVoice) u.voice = ttsVoice;
      u.rate = TTS_RATES[ttsRate];  // read per chunk, so a change lands mid-reply
      u.onend = next;
      u.onerror = next;
      speechSynthesis.speak(u);
    };
    next();
  });
}

async function fetchSpeech(text) {
  const r = await fetch('/api/tts', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
    body: JSON.stringify({ text, voice: kokoroVoice(), speed: TTS_RATES[ttsRate] }),
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.error || ('HTTP ' + r.status));
  }
  return URL.createObjectURL(await r.blob());
}

function playClip(el, url) {
  return new Promise(resolve => {
    const done = () => { el.onended = el.onerror = null; clipDone = null; resolve(); };
    clipDone = done;              // stopSpeaking pauses, which fires no event
    el.onended = done;
    el.onerror = done;
    el.src = url;
    el.play().catch(() => done());
  });
}

/* Fetch the next chunk while the current one plays. Kokoro synthesizes at
   roughly the speed the audio runs at, so taking them strictly in turn would
   leave a gap between every sentence. */
async function speakKokoro(chunks, gen) {
  const el = audioEl();
  const grab = text => fetchSpeech(text).then(url => ({ url }), err => ({ err }));
  let pending = grab(chunks[0]);
  for (let i = 0; i < chunks.length; i++) {
    const got = await pending;
    pending = (i + 1 < chunks.length && gen === ttsGen) ? grab(chunks[i + 1]) : null;
    if (got.err) {
      if (gen === ttsGen) toast('Kokoro: ' + got.err.message);
      break;
    }
    if (gen !== ttsGen) { URL.revokeObjectURL(got.url); break; }
    await playClip(el, got.url);
    URL.revokeObjectURL(got.url);
    if (gen !== ttsGen) break;
  }
  // A clip fetched for a reply we're no longer reading still has to be freed.
  if (pending) pending.then(g => { if (g.url) URL.revokeObjectURL(g.url); });
}

function stopSpeaking() {
  ttsActive = false;
  ttsGen++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (ttsAudio) { try { ttsAudio.pause(); } catch (e) {} }
  if (clipDone) clipDone();
  if (voiceStateIs('speaking')) setVoiceState(null);
}

/* ---------- background music ---------- */
/* Streams the musicforprogramming.net episodes straight from their host (the
   server only fetches the feed, which sends no CORS header). Plays while the
   agent works; pauses itself when a summary lands so the spoken update is
   clear. Manual pause is remembered across reloads; the automatic one isn't. */
let tracks = [], trackIx = 0, musicArmed = false, trackErrs = 0;
let musicWanted = localStorage.getItem('vp.music') !== '0';
/* Music is an option of voice mode, off until turned on in ⚙ (per browser).
   The server's [voice] music = false takes the option away altogether. */
let musicOn = localStorage.getItem('vp.musicOn') === '1';
let serverMusic = true, musicInited = false;
const audio = new Audio();
audio.preload = 'none';

function setMusicBtn() {
  $('musicBtn').textContent = audio.paused ? '▶' : '⏸';
  $('musicBtn').classList.toggle('on', !audio.paused);
}
function loadTrack(i, play) {
  if (!tracks.length) return;
  trackIx = ((i % tracks.length) + tracks.length) % tracks.length;
  audio.src = tracks[trackIx].url;
  $('musicLabel').textContent = tracks[trackIx].title;
  if (play) startMusic();
}
function startMusic() {
  const p = audio.play();
  if (p && p.catch) p.catch(() => {
    // Autoplay with sound is blocked until the page has been interacted with
    // (always on iOS). Start on the first tap instead.
    armMusicGesture();
    setMusicBtn();
  });
}
function armMusicGesture() {
  if (musicArmed) return;
  musicArmed = true;
  document.addEventListener('pointerdown', () => {
    musicArmed = false;
    if (musicWanted && audio.paused) startMusic();
  }, { once: true });
}
function pauseMusicForSummary() {
  // Not the user's choice, so don't remember it as one.
  if (!audio.paused) audio.pause();
}
audio.addEventListener('play', setMusicBtn);
audio.addEventListener('pause', setMusicBtn);
audio.addEventListener('playing', () => { trackErrs = 0; });
audio.addEventListener('ended', () => loadTrack(trackIx + 1, true));
audio.addEventListener('error', () => {
  if (musicWanted && ++trackErrs < 4) loadTrack(trackIx + 1, true);
});
$('musicBtn').onclick = () => {
  if (audio.paused) {
    musicWanted = true;
    localStorage.setItem('vp.music', '1');
    if (audio.src) startMusic(); else loadTrack(trackIx, true);
  } else {
    musicWanted = false;
    localStorage.setItem('vp.music', '0');
    audio.pause();
  }
};
$('musicLabel').onclick = () => {
  musicWanted = true;
  localStorage.setItem('vp.music', '1');
  loadTrack(trackIx + 1, true);
};
function applyMusic() {
  const show = serverMusic && voiceOn && musicOn;
  $('musicOpt').hidden = !(serverMusic && voiceOn);
  for (const b of $('musicSeg').children) b.classList.toggle('on', (b.dataset.on === '1') === musicOn);
  if (!show) {
    audio.pause();
    hideMusicControls();
    return;
  }
  $('musicBtn').style.display = '';
  $('musicLabel').style.display = '';
  if (!musicInited) { musicInited = true; initMusic(); }
}
for (const b of $('musicSeg').children) {
  b.onclick = () => {
    musicOn = b.dataset.on === '1';
    localStorage.setItem('vp.musicOn', musicOn ? '1' : '0');
    // Turning it on is asking for it now; this tap is the gesture it needs.
    if (musicOn) { musicWanted = true; localStorage.setItem('vp.music', '1'); }
    applyMusic();
    if (musicOn && audio.src) startMusic();
  };
}
function hideMusicControls() {
  // The bar stays — the speech-speed buttons live there too.
  $('musicBtn').style.display = 'none';
  $('musicLabel').style.display = 'none';
}
async function initMusic() {
  let d;
  try { d = await api('/api/music'); } catch (e) { hideMusicControls(); return; }
  tracks = d.tracks || [];
  if (!tracks.length) { hideMusicControls(); return; }
  setMusicBtn();
  loadTrack(Math.floor(Math.random() * tracks.length), musicWanted);
}

/* ---------- speech input ---------- */
/* Two ways in. The Web Speech API is what Safari and Chrome provide, and it is
   the low-latency one — the browser streams the mic to its own recognizer and
   hands back interim text as you talk. Firefox implements none of it, so there
   the page records the mic itself and posts the audio to whatever transcription
   server config.toml points at. Either way the mic needs a secure context. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let sttMode = localStorage.getItem('vp.sttMode') || 'auto';
let rec = null, listening = false, emptyListens = 0, restartTimer = null, recSilence = null;
let cap = null;        // the recording in flight, on the server path
let listenGen = 0;     // bumped whenever the mic is released; async work checks it

function useServerSTT() {
  if (!serverSTT) return false;
  if (sttMode === 'server') return true;
  if (sttMode === 'browser') return false;
  return !SR;          // auto: the browser's own recognizer wherever there is one
}
function sttAvailable() {
  return !!SR || (serverSTT && sttMode !== 'browser');
}

/* Why the mic isn't going to work, in terms of the browser actually asking.
   This used to name Safari's settings unconditionally, which is nonsense on a
   desktop Firefox that has no recognizer to grant permission to. */
function voiceHint(kind) {
  if (kind === 'insecure') {
    if (location.protocol === 'https:') return 'Mic unavailable in this browser.';
    if (!httpsPort) return 'Voice input needs HTTPS — set https_port in config.toml and restart the server.';
    return 'Voice input needs HTTPS. Open https://' + location.hostname + ':' + httpsPort +
           ' and accept the certificate warning once.';
  }
  if (kind === 'denied') {
    return IOS ? 'Mic blocked — check Settings > Safari > Microphone.'
               : 'Mic blocked — allow microphone access for this site (the padlock in the address bar).';
  }
  if (kind === 'nomic') return 'No microphone found.';
  if (serverSTT) return 'This browser has no speech recognition — set Speech input to "Local server" in ⚙.';
  return 'This browser has no speech recognition (Firefox ships none). Use Chrome or Safari, ' +
         'or set stt_url in config.toml to transcribe on this machine.';
}
function failListen(kind) {
  toast(voiceHint(kind));
  if (handsFree) setConvo(false);
}
function clearRestart() {
  if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
}
function markListening() {
  listening = true;
  $('mic').classList.add('listening');
  setVoiceState('listening');
}
function idleMic() {
  listening = false;
  $('mic').classList.remove('listening');
  if (voiceStateIs('listening') || voiceStateIs('transcribing')) setVoiceState(null);
}

async function startListen() {
  if (listening) return;
  // Which paths exist is the server's answer, and on a cold load it may not
  // have arrived yet — a hands-free restart can easily beat it.
  if (metaReady) { try { await metaReady; } catch (e) {} }
  if (listening) return;
  if (!window.isSecureContext) { failListen('insecure'); return; }
  if (!sttAvailable()) { failListen('nosupport'); return; }
  stopSpeaking();
  clearRestart();
  const gen = ++listenGen;   // orphans an unfinished turn, handlers and all
  discardRec();
  discardCapture();
  if (useServerSTT()) startServerListen(gen);
  else startWebSpeech();
}

/* The tail both paths share: hand the text to the advisor when hands-free, and
   decide whether the mic reopens. */
function finishListen(text) {
  idleMic();
  if (!handsFree) return;
  if (text) {
    emptyListens = 0;
    $('input').value = '';
    autogrow();
    askAdvisor('discuss', text);
  } else if (++emptyListens >= 2) {
    setConvo(false);
    toast('Voice paused (silence) — tap Convo to resume.');
  } else {
    restartTimer = setTimeout(() => {
      restartTimer = null;
      if (handsFree && !busy) startListen();
    }, 400);
  }
}

/* ---- browser recognizer (Safari, Chrome) ---- */
function startWebSpeech() {
  rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = true;
  // Continuous, so the recognizer's own endpointing (about a second) can't cut
  // a sentence short; the silence timer below decides where the turn ends.
  rec.continuous = true;
  const r = rec, t0 = performance.now();
  const quietFor = ms => {
    clearTimeout(recSilence);
    recSilence = setTimeout(() => { if (rec === r) try { r.stop(); } catch (e) {} }, ms);
  };
  quietFor(NO_SPEECH_MS);
  rec.onresult = e => {
    let text = '';
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    $('input').value = text.trim();
    autogrow();
    // Words are still arriving: the wait starts over from here.
    quietFor(Math.min(silenceMs(), Math.max(0, t0 + MAX_UTTERANCE_MS - performance.now())));
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      failListen('denied');
    } else if (e.error === 'network') {
      // Chrome talks to a Google service to recognize; Chromium builds without
      // the API keys, and any offline machine, end up here.
      toast(serverSTT
        ? 'The browser recognizer could not reach its speech service — set Speech input to "Local server" in ⚙.'
        : 'The browser recognizer could not reach its speech service.');
      if (handsFree) setConvo(false);
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      toast('mic error: ' + e.error);
    }
  };
  rec.onend = () => {
    clearTimeout(recSilence);
    rec = null;                      // spent — nothing left to abort
    finishListen($('input').value.trim());
  };
  try { rec.start(); } catch (e) { toast('mic: ' + e.message); rec = null; return; }
  markListening();
}

/* Drop the current recognition object, handlers first — a detached onend can't
   fire the hands-free restart, which is what made a stopped mic come back on.
   abort() rather than stop(): stop() keeps capturing until it can deliver a
   final result, so iOS holds the mic indicator (and fills the input box) after
   the tap that was meant to end listening. */
function discardRec() {
  clearTimeout(recSilence);
  if (!rec) return;
  rec.onresult = rec.onerror = rec.onend = null;
  try { rec.abort(); } catch (e) {}
  rec = null;
}

/* ---- recording for a transcription server (Firefox, or by choice) ---- */
const STT_RATE = 16000;
/* Where the utterance ends: this much quiet after the last speech, on both the
   browser recognizer and the recording path. Hands-free has to work that out
   for itself, so it cuts sooner; push-to-talk waits longer, because there the
   second tap is the real end signal and a pause mid-thought shouldn't pre-empt
   it. The pause buttons pick the row; read on every check, so a change lands
   on the utterance already under way. */
const SILENCE_MS = {
  short:  { convo: 1400, push: 2000 },
  normal: { convo: 2500, push: 3000 },
  long:   { convo: 4000, push: 5000 },
};
let listenPause = localStorage.getItem('vp.listenPause');
if (!SILENCE_MS[listenPause]) listenPause = 'normal';
function silenceMs() { return SILENCE_MS[listenPause][handsFree ? 'convo' : 'push']; }
function setListenPause(name) {
  if (!SILENCE_MS[name]) return;
  listenPause = name;
  localStorage.setItem('vp.listenPause', name);
  for (const b of $('listenPause').querySelectorAll('button'))
    b.classList.toggle('on', b.dataset.pause === name);
}
for (const b of $('listenPause').querySelectorAll('button')) b.onclick = () => setListenPause(b.dataset.pause);
setListenPause(listenPause);
const NO_SPEECH_MS = 7000, MAX_UTTERANCE_MS = 60000;

/* Raw frames straight off the graph. MediaRecorder would hand back Opus in a
   container that then needs decoding somewhere; this way the samples are
   already what the WAV wants, and the same frames drive the silence detector. */
const CAPTURE_WORKLET = `
class Cap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch && ch.length) this.port.postMessage(new Float32Array(ch));
    return true;
  }
}
registerProcessor('vp-capture', Cap);
`;
let workletUrl = null;

async function startServerListen(gen) {
  markListening();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true,
               noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    if (gen !== listenGen) return;
    idleMic();
    failListen(e && e.name === 'NotFoundError' ? 'nomic' : 'denied');
    return;
  }
  if (gen !== listenGen) { stopTracks(stream); return; }   // released while it asked

  let ctx = null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    // 16 kHz straight from the graph is what whisper wants; if the browser
    // insists on its own rate, wavBlob resamples on the way out.
    try { ctx = new AC({ sampleRate: STT_RATE }); } catch (e) { ctx = new AC(); }
    if (!workletUrl) {
      workletUrl = URL.createObjectURL(
        new Blob([CAPTURE_WORKLET], { type: 'application/javascript' }));
    }
    await ctx.audioWorklet.addModule(workletUrl);
    await ctx.resume();
  } catch (e) {
    stopTracks(stream);
    if (ctx) ctx.close().catch(() => {});
    if (gen !== listenGen) return;
    idleMic();
    toast('mic capture failed: ' + e.message);
    if (handsFree) setConvo(false);
    return;
  }
  if (gen !== listenGen) { stopTracks(stream); ctx.close().catch(() => {}); return; }

  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, 'vp-capture');
  // Nothing here should be audible, but the graph only runs where it reaches
  // the destination, so the tap goes out through a silent gain.
  const mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(node);
  node.connect(mute);
  mute.connect(ctx.destination);

  const t0 = performance.now();
  cap = { gen, ctx, stream, src, node, mute, chunks: [], rate: ctx.sampleRate,
          noise: 0.005, spoke: false, t0, lastLoud: t0 };
  node.port.onmessage = e => {
    const c = cap;
    if (!c || c.gen !== listenGen) return;
    const frame = e.data;
    c.chunks.push(frame);
    let sum = 0;
    for (let i = 0; i < frame.length; i++) sum += frame[i] * frame[i];
    const rms = Math.sqrt(sum / frame.length);
    const t = performance.now();
    // Adaptive gate: the floor follows the room, and speech has to clear it.
    if (rms > c.noise * 3 + 0.008) { c.spoke = true; c.lastLoud = t; }
    else c.noise = c.noise * 0.95 + rms * 0.05;
    if (c.spoke ? t - c.lastLoud > silenceMs() : t - c.t0 > NO_SPEECH_MS) endCapture(true);
    else if (t - c.t0 > MAX_UTTERANCE_MS) endCapture(true);
  };
}

function stopTracks(stream) {
  try { for (const t of stream.getTracks()) t.stop(); } catch (e) {}
}
function teardownCapture(c) {
  try {
    c.node.port.onmessage = null;
    c.node.disconnect();
    c.src.disconnect();
    c.mute.disconnect();
  } catch (e) {}
  stopTracks(c.stream);      // the browser's recording indicator goes out here
  c.ctx.close().catch(() => {});
}
/* Throw the recording away — the mic goes quiet and what was said is dropped. */
function discardCapture() {
  const c = cap;
  if (!c) return;
  cap = null;
  teardownCapture(c);
}

/* Close the recording and, if anything was actually said, send it up. */
async function endCapture(transcribe) {
  const c = cap;
  if (!c) return;
  cap = null;
  teardownCapture(c);
  if (c.gen !== listenGen) return;                  // released mid-utterance
  if (!transcribe || !c.spoke) { finishListen(''); return; }
  setVoiceState('transcribing');
  let text = '';
  try {
    const d = await api('/api/stt', {
      method: 'POST',
      headers: { 'Content-Type': 'audio/wav' },
      body: wavBlob(joinChunks(c.chunks), c.rate),
    });
    text = (d.text || '').trim();
  } catch (e) {
    if (c.gen !== listenGen) return;
    idleMic();
    toast('transcription failed — ' + e.message);
    if (handsFree) setConvo(false);   // don't loop a hands-free turn onto a dead server
    return;
  }
  if (c.gen !== listenGen) return;
  if (text) { $('input').value = text; autogrow(); }
  finishListen(text);
}

function joinChunks(chunks) {
  let n = 0;
  for (const c of chunks) n += c.length;
  const out = new Float32Array(n);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}
function resampleTo(data, from, to) {
  if (from === to || !data.length) return data;
  const ratio = from / to, n = Math.max(1, Math.round(data.length / ratio));
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = i * ratio, i0 = Math.floor(x), i1 = Math.min(i0 + 1, data.length - 1);
    out[i] = data[i0] + (data[i1] - data[i0]) * (x - i0);
  }
  return out;
}
/* 16 kHz mono 16-bit WAV: the one format every transcription server takes, and

function wavBlob(samples, rate) {
  const pcm = resampleTo(samples, rate || STT_RATE, STT_RATE);
  const buf = new ArrayBuffer(44 + pcm.length * 2);
  const dv = new DataView(buf);
  const tag = (off, str) => {
    for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i));
  };
  tag(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); tag(8, 'WAVE');
  tag(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, STT_RATE, true); dv.setUint32(28, STT_RATE * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  tag(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) {
    const v = Math.max(-1, Math.min(1, pcm[i]));
    dv.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

/* Off means off. Bumping listenGen orphans everything still in flight — a
   recognition object, a recording, a transcription already posted — so none of
   it can come back and reopen the mic after the tap that closed it. */
function releaseMic() {
  listenGen++;
  clearRestart();
  discardRec();
  discardCapture();

}

/* The user says they're done. On the browser recognizer that abandons the turn
   (see discardRec). On the recording path the tap *is* the end of the
   utterance, so the audio still goes up — losing a sentence to a mistimed tap
   would be worse than the extra second of waiting. */
function stopListen() {
  if (cap) endCapture(true);
  else releaseMic();
}

/* ---------- agent reply summaries ---------- */
/* After a prompt goes to the agent the server watches its pane, and once the
   agent settles it posts a short summary of what it did. Poll for that instead
   of making the user read the terminal. */
let summarizeOn = true, lastSummaryTs = 0, updTimer = null, pendingSummary = null;

function showSummaryPending() {
  if (pendingSummary) return;
  pendingSummary = addBubble('summary pending', 'agent working');
}
function clearSummaryPending() {
  if (pendingSummary) { pendingSummary.remove(); pendingSummary = null; }
}

  if (!updTimer) updTimer = setInterval(pollUpdates, 4000);
}
function stopUpdates() {
  clearInterval(updTimer);

  if (!current) return;      // both columns can be up at once on a desktop
  let d;
  try {
    d = await api('/api/updates?project=' + encodeURIComponent(current) +
                  '&after=' + lastSummaryTs);
  } catch (e) {
    return;  // transient — keep polling
  }
  for (const m of (d.summaries || [])) {
    lastSummaryTs = Math.max(lastSummaryTs, m.ts || 0);
    clearSummaryPending();
    pauseMusicForSummary();  // clear the air for the spoken summary
    addSummaryBubble(m.text, null, undefined, m.agent);
    // Read it out only if nothing else is using the voice right now.
    // Both columns can show the same summary; only the focused one reads it out.
    if (speakOn && view === 'project' && !busy && !listening && !ttsActive) speakText(m.text);

let homeTimer = null, homeSig = '', homeSkew = 0, homeIdleOpen = false;

function ago(t) {
  const s = Math.max(0, Date.now() / 1000 + homeSkew - t);
  return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm'

    return m ? h + 'h ' + m + 'm' : h + 'h';

  const share = u.share_7d_pct >= 0.5 ? ' · ' + Math.round(u.share_7d_pct) + '% of 7d ' + agentShort(agent) : '';
  parts.push('7d: ' + fmtTokens(u.d7.total_tokens) + ' tok' + share);

/* An excerpt as one plain line: the card is a glance, the details are below. */
