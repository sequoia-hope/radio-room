  const l = (t || '').replace(/```[\s\S]*?(```|$)/g, ' ').replace(/[*`#>]/g, '')
                     .replace(/\s+/g, ' ').trim();
  return l.length > n ? l.slice(0, n).replace(/\s\S*$/, '') + '…' : l;
}

async function loadHome(force) {
  let d;
  try { d = await api('/api/instances'); }
  catch (e) {
    if (!homeSig) $('homeInner').innerHTML = '<p class="hnote">' + esc(e.message) + '</p>';
    return;
  }
  homeSkew = d.now - Date.now() / 1000;
  if (d.services) lastServices = d.services;
  homeCpu = d.cpu || null;
  const sig = JSON.stringify([d.instances, d.services, cpuSig(homeCpu)]);
  if (force || sig !== homeSig) { homeSig = sig; renderHome(d.instances, d.services); }
  else for (const el of document.querySelectorAll('#home .atime'))
    el.textContent = ago(+el.dataset.since);
}

function renderHome(list, services) {
  const box = $('homeInner');
  const keep = box.parentElement.scrollTop;
  box.innerHTML = '';
  // Pinned cards keep their own section at the top, whatever their state.
  const pinned = list.filter(i => i.pinned);
  const need = list.filter(i => !i.pinned && SETTLED.includes(i.state));
  const work = list.filter(i => !i.pinned && (i.state === 'working' || i.state === 'starting'));
  const fresh = list.filter(i => !i.pinned && i.state === 'new');
  const rest = list.filter(i => !i.pinned && !need.includes(i) && !work.includes(i) && !fresh.includes(i));
  const section = (title, items, empty) => {
    const h = document.createElement('div');
    h.className = 'hsec';
    h.textContent = title + (items.length ? ' · ' + items.length : '');
    box.appendChild(h);
    if (!items.length) {
      box.insertAdjacentHTML('beforeend', '<p class="hnote">' + empty + '</p>');
      return;
    }
    const g = document.createElement('div');
    g.className = 'hgrid';
    items.forEach(i => g.appendChild(homeCard(i)));
    box.appendChild(g);
  };
  const badge = $('needBadge');
  const needing = need.length + pinned.filter(i => SETTLED.includes(i.state)).length;
  badge.hidden = !needing;
  badge.textContent = needing;
  if (pinned.length) section('Pinned', pinned, '');
  const sgrid = renderServices(services || lastServices);
  if (sgrid) box.appendChild(sgrid);
  const cpanel = renderCpu(homeCpu);
  if (cpanel) box.appendChild(cpanel);
  section('Needs you', need, 'Nothing is waiting on you.');
  if (fresh.length) section('New', fresh, '');
  section('Working', work, 'No agent is working right now.');
  if (rest.length) {
    const det = document.createElement('details');
    det.open = homeIdleOpen;
    det.ontoggle = () => {
      homeIdleOpen = det.open;
      try { localStorage.setItem('vp.home.idle', det.open ? '1' : '0'); } catch (e) {}
    };
    det.innerHTML = '<summary class="hsec">Idle · ' + rest.length + '</summary>';
    const g = document.createElement('div');
    g.className = 'hgrid';
    rest.forEach(i => g.appendChild(homeCard(i)));
    det.appendChild(g);
    box.appendChild(det);
  }
  box.parentElement.scrollTop = keep;
}

/* ---------- the CPU queue ---------- */
/* reserve/'s book, as /api/instances carries it: a summary line that opens
   to the running and waiting jobs, their controls, and what finished lately. */
function cpuSig(c) {
  if (!c || c.error) return c && c.error;
  return [c.paused, c.keep_free, c.capacity,
          c.entries.map(e => [e.id, e.state, e.cores, e.position, e.stop]),
          (c.history || []).slice(0, 6).map(h => h.id)];
}
/* What an agent's card says about its project's place in the queue. Only the
   project's default agent says it: the book knows projects, not agents. */
function cpuFor(i) {
  const c = homeCpu;
  if (!c || c.error || i.agent !== DEFAULT_AGENT) return '';
  const mine = c.entries.filter(e => e.project === i.project);
  const run = mine.filter(e => e.state === 'granted').reduce((n, e) => n + e.cores, 0);
  const wait = mine.filter(e => e.state === 'waiting');
  const out = [];
  if (run) out.push('<span class="ch">▣ ' + run + ' cores booked</span>');
  if (wait.length) out.push('<span class="cq">⏳ waiting for ' +
    wait.reduce((n, e) => n + e.cores, 0) + ' cores (#' + Math.min(...wait.map(e => e.position)) +
    (c.paused ? ', queue paused' : '') + ')</span>');
  return out.join(' · ');
}
async function cpuPost(body) {
  try { await api('/api/cpu', { body }); }
  catch (e) { toast(e.message); }
  await loadHome(true);
}
function renderCpu(c) {
  if (!c) return null;
  const d = document.createElement('details');
  d.className = 'cpu';
  d.open = cpuOpen;
  d.ontoggle = () => {
    cpuOpen = d.open;
    try { localStorage.setItem('vp.home.cpu', d.open ? '1' : '0'); } catch (e) {}
  };
  if (c.error) {
    d.innerHTML = '<summary>CPU queue <span class="cwait">' + esc(c.error) + '</span></summary>';
    return d;
  }
  const run = c.entries.filter(e => e.state === 'granted');
  const wait = c.entries.filter(e => e.state === 'waiting');
  const cores = n => n + ' core' + (n === 1 ? '' : 's');
  let h = '<summary><span>CPU</span><span class="cbar">' +
    run.map(e => '<span' + (e.stop ? ' class="stop"' : '') + ' style="width:' +
                 (100 * e.cores / c.capacity) + '%" title="' + esc(e.project + ': ' + e.cores) + '"></span>').join('') +
    '</span><span class="cnum">' + c.booked + '/' + c.capacity + '</span>' +
    (wait.length ? '<span class="cwait">' + wait.length + ' waiting</span>' : '') +
    (c.paused ? '<span class="cpaused">paused</span>' : '') + '</summary>';
  h += '<div class="ctl"><button data-c="pause">' + (c.paused ? '▶ Resume' : '⏸ Pause') + '</button>' +
       '<span class="hnote">kept free</span><button data-c="kf-">−</button><span class="n">' + c.keep_free +
       '</span><button data-c="kf+">+</button><span class="hnote">load ' + Math.round(c.load) + ' on ' +
       c.cores + (c.pressure != null ? ' · pressure ' + Math.round(c.pressure) + '%' : '') + '</span></div>';
  const row = (e, cls, btns, sub) =>
    '<div class="crow ' + cls + '"><span class="ccores">' + cores(e.cores) + '</span>' +
    '<span class="cwhat"><b>' + esc(e.project) + '</b> ' + esc(e.label || '') +
    '<div title="' + esc(e.command || '') + '">' + sub + esc(e.command || '') + '</div></span>' +
    (btns ? '<span class="cbtns">' + btns + '</span>' : '') + '</div>';
  const since = t => '<span class="atime" data-since="' + t + '">' + ago(t) + '</span> · ';
  h += '<div class="csec">Running</div>' + (run.length ? run.map(e => row(e, 'run',
         e.stop ? '<span class="hnote">stopping…</span>' : '<button class="x" data-c="stop" data-id="' + e.id + '">Stop</button>',
         since(e.granted) + (e.where && e.where !== 'host' ? 'in ' + esc(e.where) + ' · ' : ''))).join('')
       : '<p class="hnote">Nothing booked.</p>');
  h += '<div class="csec">Waiting</div>' + (wait.length ? wait.map((e, n) => row(e, 'wait',
         (n ? '<button data-c="front" data-id="' + e.id + '">Front</button>' : '') +
         '<button data-c="cores" data-id="' + e.id + '" data-n="' + e.cores + '">Cores</button>' +
         '<button class="x" data-c="cancel" data-id="' + e.id + '">Cancel</button>',
         '#' + e.position + ' · ' + since(e.requested))).join('')
       : '<p class="hnote">Nobody waiting.</p>');
  const HOW = { done: 'done', stopped: 'stopped', cancelled: 'cancelled', lapsed: 'client vanished' };
  const hist = (c.history || []).slice(0, 6);
  if (hist.length) h += '<div class="csec">Finished lately</div>' + hist.map(x => row(x, 'hist', '',
       (HOW[x.how] || x.how) + (x.code ? ' · exit ' + x.code : '') + ' · ' + since(x.ended))).join('');
  d.innerHTML = h;
  d.querySelectorAll('button[data-c]').forEach(b => b.onclick = ev => {
    ev.preventDefault();
    const id = b.dataset.id, e = c.entries.find(x => x.id === id);
    switch (b.dataset.c) {
      case 'pause': return cpuPost({ paused: !c.paused });
      case 'kf-': return cpuPost({ keep_free: c.keep_free - 1 });
      case 'kf+': return cpuPost({ keep_free: c.keep_free + 1 });
      case 'front': case 'cancel': return cpuPost({ verb: b.dataset.c, id });
      case 'cores': {
        const n = parseInt(prompt('Cores for ' + e.project + (e.label ? ' (' + e.label + ')' : '') + '?', b.dataset.n), 10);
        return n > 0 ? cpuPost({ verb: 'cores', id, cores: n }) : null;
      }
      case 'stop':
        if (confirm('Stop ' + e.project + "'s " + cores(e.cores) + ' job?\n\n' + (e.label || e.command) +
                    '\n\nIts command gets SIGTERM, then SIGKILL if it lingers.'))
          return cpuPost({ verb: 'stop', id });
    }
  });
  return d;
}

function homeCard(i) {
  const key = i.project + '/' + i.agent;
  const m = i.message, s = m && m.summary;
  const working = i.state === 'working' || i.state === 'starting';
  const fresh = i.state === 'new';   // a project added lately, never run
  const settled = SETTLED.includes(i.state) || fresh;
  const quiet = !settled && !working;
  const open = homeOpen.has(key);
  const c = document.createElement('div');
  c.className = 'acard st-' + i.state + (quiet ? ' quiet' : '');
  const btns = '<div class="abtns">' +
       (settled ? '<button class="dismiss" data-act="dismiss">&#10003; Seen</button>' : '') +
       '<button class="voice needsVoice" data-act="voice" title="Talk about ' + esc(i.project) + ' (' +
       esc(agentShort(i.agent)) + ') by voice">&#127908; Voice</button>' +
       (i.alive && !quiet ? '<button data-act="term">Terminal</button>' : '') +
       (i.web ? '<a target="_blank" rel="noopener" href="' + esc(i.web.url || webUrl(i.web)) + '"' +
                (i.web.up ? '' : ' title="not running"') + '>web' + (i.web.up ? '' : ' ○') + ' &#8599;</a>' : '') +
       '<button data-act="more">' + (open ? 'Less' : 'More') + '</button>' +
       '<button class="pin' + (i.pinned ? ' on' : '') + '" data-act="pin" title="' +
       (i.pinned ? 'Unpin' : 'Pin to the top') + '">&#128204;</button></div>';
  let h = '<div class="ahead">' +
          (i.state === 'idle' ? '' : '<span class="apill">' + esc(STATE_LABEL[i.state] || i.state) + '</span>') +
          '<span class="aname">' + esc(i.project) + '</span><span class="achip">' +
          esc(agentShort(i.agent)) + '</span>' +
          (quiet && i.usage && i.usage.d7 && i.usage.d7.turns
            ? '<span class="uchip" title="' + esc(fmtInstUsage(i.usage, i.agent)) + '">' +
              esc(fmtTokens(i.usage.d7.total_tokens)) +
              (i.usage.share_7d_pct >= 1 ? ' · ' + Math.round(i.usage.share_7d_pct) + '%' : '') + '</span>'
            : '') +
          (quiet ? btns : (i.since || i.recent) ? '<span class="atime" data-since="' + (i.since || i.recent) + '">' + ago(i.since || i.recent) + '</span>' : '') +
          '</div>';
  const meta = [];
  if (i.aliases.length) meta.push('also ' + i.aliases.join(', '));
  if (i.background_tasks) meta.push('⚙ ' + i.background_tasks + ' in background');
  const q = cpuFor(i);
  const uline = !quiet ? fmtInstUsage(i.usage, i.agent) : '';
  if (uline) meta.push(uline);
  if (!i.alive && !fresh) meta.push('session gone');
  else if (!i.hooked && !quiet) meta.push('read from the terminal');
  if (meta.length || q) h += '<div class="ameta">' + (q ? q + (meta.length ? ' · ' : '') : '') +
                             esc(meta.join(' · ')) + '</div>';
  if (i.reason) h += '<div class="asum"><span class="alabel">waiting on</span>' + esc(i.reason) + '</div>';
  if (m) {
    let label, text;
    if (s) {
      const by = s.source === 'sonnet' ? 'sonnet' : 'granite';
      label = working || quiet ? 'last turn · ' + by : by === 'sonnet' ? 'summary · sonnet' : 'rough summary · granite';
      text = s.text;
    } else {
      label = working || quiet ? 'last turn' : m.summary_pending ? 'last message · summarizing…' : 'last message';
      text = plainLine(m.excerpt);
    }
    h += '<div class="asum' + (working ? ' old' : '') + '"><span class="alabel">' + label + '</span>' +
         esc(text) + '</div>';
    // The state is the rules' call; the model's reading is shown only where
    // it differs, as a nudge to look.
    if (s && s.source !== 'sonnet' && settled && s.status_guess && s.status_guess !== i.state)
      h += '<div class="ahint">Granite reads it as ' + esc(GUESS_LABEL[s.status_guess] || s.status_guess) + '</div>';
  } else if (fresh) {
    h += '<div class="asum old"><span class="alabel">new project · no agent started yet</span></div>';
  } else if (!i.reason && !quiet) {
    h += '<div class="asum old"><span class="alabel">no finished turn on record</span></div>';
  }
  h += (quiet ? '' : btns) + '<div class="adetail"' + (open ? '' : ' hidden') + '></div>';
  c.innerHTML = h;
  const detail = c.querySelector('.adetail');
  if (open) fillDetail(detail, i);
  c.querySelector('[data-act=voice]').onclick = () => {
    try { localStorage.setItem('vp.agent.' + i.project, i.agent); } catch (e) {}
    setView('project', i.project);
  };
  const term = c.querySelector('[data-act=term]');
  if (term) term.onclick = () => openTerminal(i.project, i.agent);
  const dis = c.querySelector('[data-act=dismiss]');
  if (dis) dis.onclick = async () => {
    dis.disabled = true;
    try { await api('/api/instances/dismiss', { body: { project: i.project, agent: i.agent } }); }
    catch (e) { toast(e.message); dis.disabled = false; return; }
    await loadHome(true);
  };
  const pin = c.querySelector('[data-act=pin]');
  pin.onclick = async () => {
    pin.disabled = true;
    try { await api('/api/pin', { body: { project: i.project, view: 'agents', pinned: !i.pinned } }); }
    catch (e) { toast(e.message); pin.disabled = false; return; }
    await loadHome(true);
  };
  const more = c.querySelector('[data-act=more]');
  more.onclick = () => {
    const show = detail.hidden;
    detail.hidden = !show;
    more.textContent = show ? 'Less' : 'More';
    if (show) { homeOpen.add(key); fillDetail(detail, i); }
    else { homeOpen.delete(key); delete homePanes[key]; }
  };
  return c;
}

/* ---------- the full-screen terminal ---------- */
/* One agent's live terminal over the whole page — a tmux client over
   /ws/attach, as the desktop window's tabs are VTE ones. The bar switches
   agent; ‹ (or the phone's back gesture) closes it, which detaches: the
   agent keeps running. Sized to the visual viewport, so the soft keyboard
   shrinks the terminal rather than covering it. */
let termProject = null, termPushed = false;

async function openTerminal(project, agent) {
  try { localStorage.setItem('vp.agent.' + project, agent); } catch (e) {}
  termProject = project;
  $('termTitle').textContent = project;
  $('termView').hidden = false;
  document.body.classList.add('termOpen');
  if (!termPushed) { history.pushState({ term: 1 }, ''); termPushed = true; }
  sizeTermView();
  showTermAgent(agent);
  // The toggle wants every agent's state, which the Projects tab may not have.
  if (!reposList.some(p => p.name === project)) {
    try { reposList = (await api('/api/registry')).projects; } catch (e) {}
  }
  renderTermAgents();
}

function renderTermAgents() {
  const p = reposList.find(x => x.name === termProject), seg = $('termAgents');
  seg.innerHTML = '';
  if (!p) return;
  const on = live ? live.agent : repoAgent(p);
  for (const [id, st] of Object.entries(p.agents)) {
    const b = document.createElement('button');
    b.className = id === on ? 'on' : '';
    b.innerHTML = '<span class="dot' + (st.up ? ' on' : '') + '"></span>' + esc(agentShort(id));
    b.onclick = () => {
      try { localStorage.setItem('vp.agent.' + termProject, id); } catch (e) {}
      showTermAgent(id);
      renderTermAgents();
    };
    seg.appendChild(b);
  }
}

function showTermAgent(agent) {
  if (live && live.agent === agent && live.project === termProject) return;
  if (live) { live.dispose(); live = null; }
  const host = $('termHost');
  host.innerHTML = '';
  const p = reposList.find(x => x.name === termProject);
  if (p && p.agents[agent] && !p.agents[agent].up) {
    // Not running: say so, with the one thing to do about it.
    host.innerHTML = '<div class="tnote">' + esc(agentShort(agent)) + ' isn\u2019t running in ' +
                     esc(termProject) + '.<br><button class="ract start">Start it</button></div>';
    host.querySelector('button').onclick = async e => {
      e.target.disabled = true;
      try { await api('/api/control', { body: { action: 'start_agent', project: termProject, agent } }); }
      catch (err) { toast(err.message); e.target.disabled = false; return; }
      try { reposList = (await api('/api/registry')).projects; } catch (err) {}
      showTermAgent(agent);
      renderTermAgents();
    };
    return;
  }
  live = new LiveTerm(termProject, agent);
  host.appendChild(live.host);
  live.mounted();
}

function closeTerminal(fromHistory) {
  if ($('termView').hidden) return;
  if (live) { live.dispose(); live = null; }
  $('termHost').innerHTML = '';
  $('termView').hidden = true;
  document.body.classList.remove('termOpen');
  termProject = null;
  if (termPushed && !fromHistory) { termPushed = false; history.back(); }
  termPushed = false;
  if (view === 'repos') loadRepos(true);
}
$('termClose').onclick = () => closeTerminal(false);
addEventListener('popstate', () => closeTerminal(true));

function sizeTermView() {
  const vv = window.visualViewport, el = $('termView');
  if (!vv || el.hidden) return;
  el.style.top = vv.offsetTop + 'px';
  el.style.height = vv.height + 'px';
  if (live) live.fit();
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', sizeTermView);
  visualViewport.addEventListener('scroll', sizeTermView);
}

/* The browser terminal (terminal/), opened on this agent's session: it
   switches to a tab already showing it, or attaches a new one. */
function terminalUrl(project, agent) {
  const u = new URL(webUrl(terminalWeb));
  u.searchParams.set('attach', project);
  u.searchParams.set('agent', agent);
  return u.toString();
}

/* The full final message, where it came from, and the live terminal — what
   the one-liner was made from, so it can be checked. */
async function fillDetail(box, i) {
  const key = i.project + '/' + i.agent, m = i.message;
  let ev = m && eventCache[m.event];
  if (m && !ev) {
    box.innerHTML = '<p class="hnote pending">loading</p>';
    try { ev = eventCache[m.event] = await api('/api/event?id=' + m.event); }
    catch (e) { box.innerHTML = '<p class="hnote">' + esc(e.message) + '</p>'; return; }
  }
  box.innerHTML = '';
  if (i.usage && i.usage.d7 && i.usage.d7.turns) {
    const u5 = i.usage.h5 || {}, u1 = i.usage.d1 || {}, u7 = i.usage.d7 || {};
    const rows = [
      ['5h', u5], ['24h', u1], ['7d', u7]
    ].filter(([, w]) => w.turns).map(([lbl, w]) =>
      lbl + ': ' + w.turns + ' turns · ' + fmtTokens(w.total_tokens) + ' tok (' +
      fmtTokens(w.input_tokens + (w.cache_write_tokens || 0)) + ' in, ' +
      fmtTokens(w.cache_read_tokens) + ' cache, ' + fmtTokens(w.output_tokens) + ' out)'
    );
    box.insertAdjacentHTML('beforeend',
      '<div class="apath" style="margin:0 0 8px">' + esc(rows.join('  |  ')) + '</div>');
  }
  if (ev) {
    const when = new Date(ev.ts * 1000).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
    box.insertAdjacentHTML('beforeend',
      '<span class="alabel">final message · ' + esc(when) + '</span>' +
      '<div class="amsg">' + md(ev.message || '(empty)') + '</div>' +
      (ev.transcript_path ? '<div class="apath">' + esc(ev.transcript_path) + '</div>' : ''));
  }
  const btns = document.createElement('div');
  btns.className = 'abtns';
  if (ev && !(ev.summary && ev.summary.source === 'sonnet')) {
    const b = document.createElement('button');
    b.textContent = 'Ask Sonnet for a summary';
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = 'Asking Sonnet…';
      try { await api('/api/event/sonnet', { body: { id: m.event } }); }
      catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Ask Sonnet for a summary'; return; }
      delete eventCache[m.event];
      await loadHome(true);
    };
    btns.appendChild(b);
  }
  if (ev && ev.transcript_path && navigator.clipboard) {
    const b = document.createElement('button');
    b.textContent = 'Copy path';
    b.onclick = () => navigator.clipboard.writeText(ev.transcript_path)
      .then(() => toast('Transcript path copied'), () => toast('Copy failed'));
    btns.appendChild(b);
  }
  if (i.alive) {
    const b = document.createElement('button');
    const pre = document.createElement('pre');
    pre.className = 'term';
    const show = text => {
      pre.textContent = text || '(empty)';
      if (!pre.isConnected) box.appendChild(pre);
      pre.scrollTop = pre.scrollHeight;
    };
    b.textContent = homePanes[key] !== undefined ? 'Refresh terminal' : 'Terminal';
    b.onclick = async () => {
      b.disabled = true;
      try {
        const d = await api('/api/pane?project=' + encodeURIComponent(i.project) +
                            '&agent=' + encodeURIComponent(i.agent) + '&lines=80');
        homePanes[key] = d.text;
        show(d.text);
        b.textContent = 'Refresh terminal';
      } catch (e) { toast(e.message); }
      b.disabled = false;
    };
    btns.appendChild(b);
    box.appendChild(btns);
    if (homePanes[key] !== undefined) show(homePanes[key]);
  } else {
    box.appendChild(btns);
  }
}

/* ---------- Projects: the registry, as an accordion ---------- */
/* Every project, running or not, as the desktop window's Projects view has
   it: a monorepo's worktrees together under the repository's name, each with
   its branch, whether it is a worktree, its subdirectory and its tickets.
   One project is open at a time. Open, it has a toggle for which agent, and
   that agent's Terminal (full screen, below), Talk and Stop — or Start when
   it isn't running. */
let reposTimer = null, reposSig = '', reposList = [];
let openProject = localStorage.getItem('vp.repos.open') || null;
let live = null;                    // the one LiveTerm, while the terminal is up

function startRepos() { if (!reposTimer) reposTimer = setInterval(() => loadRepos(), 5000); }
function stopRepos() { clearInterval(reposTimer); reposTimer = null; }

async function loadRepos(force) {
  let d;
  try { d = await api('/api/registry'); }
  catch (e) {
    if (!reposSig) $('reposList').innerHTML = '<p class="hnote">' + esc(e.message) + '</p>';
    return;
  }
  reposList = d.projects;
  const sig = JSON.stringify(d.projects);
  if (force || sig !== reposSig) { reposSig = sig; renderRepos(d.projects); }
}
$('repoFilter').addEventListener('input', () => {
  $('repoFilterClear').hidden = !$('repoFilter').value;
  renderRepos(reposList);
});
$('repoFilterClear').addEventListener('click', () => {
  $('repoFilter').value = '';
  $('repoFilter').dispatchEvent(new Event('input'));
  $('repoFilter').focus();
});

function ticketHref(key) { return jiraUrl ? jiraUrl + '/browse/' + encodeURIComponent(key) : null; }

/* Which agent an open project shows: the one picked for it, else a running
   one, else the default. */
function repoAgent(p) {
  const ids = Object.keys(p.agents || {});
  const want = localStorage.getItem('vp.agent.' + p.name);
  if (want && ids.includes(want)) return want;
  return ids.find(id => p.agents[id].up) || (ids.includes(DEFAULT_AGENT) ? DEFAULT_AGENT : ids[0]);
}

function renderRepos(list) {
  const box = $('reposList');
  const keep = $('repos').scrollTop;
  const want = $('repoFilter').value.trim().toLowerCase();
  const shown = list.filter(p => !want || p.name.toLowerCase().includes(want) ||
    ((p.git && p.git.branch) || '').toLowerCase().includes(want) ||
    (p.tickets || []).some(k => k.toLowerCase().includes(want)));
  // A repository gets a heading of its own when several projects share it — a
  // monorepo's worktrees; standalone repos share one, and outside git is last.
  const perRepo = {};
  for (const p of list) if (p.git) perRepo[p.git.repo] = (perRepo[p.git.repo] || 0) + 1;
  const groups = new Map();
  // Pinned projects come first, out of their repository's group.
  for (const p of shown) {
    const k = p.pinned ? '~pinned' : !p.git ? '~none' : perRepo[p.git.repo] > 1 ? p.git.repo : '~single';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  }
  const rank = k => k === '~pinned' ? -1 : k === '~none' ? 2 : k === '~single' ? 1 : 0;
  const order = [...groups.keys()].sort((a, b) => rank(a) - rank(b) ||
    (rank(a) ? 0 : groups.get(a)[0].git.name.localeCompare(groups.get(b)[0].git.name)));
  box.innerHTML = '';
  if (!shown.length) {
    box.innerHTML = '<p class="hnote">' + (list.length ? 'Nothing matches.' : 'No projects registered.') + '</p>';
  }
  for (const k of order) {
    const items = groups.get(k);
    const h = document.createElement('div');
    h.className = 'hsec rsec';
    const title = k === '~pinned' ? 'Pinned' : k === '~none' ? 'Not in git' :
                  k === '~single' ? 'Projects' : items[0].git.name;
    h.innerHTML = esc(title) + ' · ' + items.length +
      (k[0] !== '~' ? '<span class="rpath">' + esc(k.replace(/\/\.git$/, '')) + '</span>' : '');
    box.appendChild(h);
    const g = document.createElement('div');
    g.className = 'rlist';
    items.forEach(p => g.appendChild(repoCard(p)));
    box.appendChild(g);
  }
  $('repos').scrollTop = keep;
}

function repoCard(p) {
  const agents = Object.entries(p.agents || {});
  const up = agents.some(([, a]) => a.up);
  const open = p.name === openProject;
  const c = document.createElement('div');
  c.className = 'acard rcard' + (up ? ' live' : '') + (open ? ' open' : '');
  c.dataset.project = p.name;
  let h = '<div class="rtop"><span class="dot' + (up ? ' on' : '') + '"></span>' +
          '<span class="aname">' + esc(p.name) + '</span>';
  const running = agents.filter(([, a]) => a.up).map(([id]) => agentShort(id));
  if (running.length && !(running.length === 1 && running[0] === agentShort(DEFAULT_AGENT)))
    h += '<span class="achip on">' + esc(running.join(' · ')) + '</span>';
  if (p.port) {
    const t = { host: p.host, port: p.port, scheme: p.scheme, path: p.path };
    h += '<a class="rweb" target="_blank" rel="noopener" href="' + esc(p.url || webUrl(t)) + '"' +
         (p.up ? '' : ' title="not running"') + '>web' + (p.up ? '' : ' ○') + ' &#8599;</a>';
  }
  h += '<button class="rpin' + (p.pinned ? ' on' : '') + '" title="' +
       (p.pinned ? 'Unpin' : 'Pin to the top') + '">&#128204;</button>' +
       '<span class="chev">' + (open ? '&#9662;' : '&#9656;') + '</span></div>';
  const sub = [];
  if (p.git) {
    const bits = ['⎇ ' + esc(p.git.branch || 'detached')];
    if (p.git.worktree) bits.push('<span class="wt">worktree</span>');
    if (p.git.subdir) bits.push(esc(p.git.subdir));
    sub.push('<span class="rgit">' + bits.join(' · ') + '</span>');
  }
  for (const k of (p.tickets || [])) {
    const href = ticketHref(k);
    sub.push(href ? '<a class="tchip" target="_blank" rel="noopener" href="' + esc(href) + '">' + esc(k) + '</a>'
                  : '<span class="tchip">' + esc(k) + '</span>');
  }
  if (sub.length) h += '<div class="rsub">' + sub.join(' ') + '</div>';
  if (open) {
    if (p.desc) h += '<div class="rdesc">' + esc(p.desc) + '</div>';
    const pu = fmtProjUsage(p.usage);
    if (pu) h += '<div class="ameta">' + esc(pu) + '</div>';
    h += '<div class="rbar"><div class="seg aseg"></div><span class="grow"></span></div>' +
'';
  }
  c.innerHTML = h;
  // The header opens and closes it; links in it stay links.
  c.querySelector('.rtop').onclick = e => { if (!e.target.closest('a, button')) toggleProject(p.name); };
  const pin = c.querySelector('.rpin');
  pin.onclick = async () => {
    pin.disabled = true;
    try { await api('/api/pin', { body: { project: p.name, view: 'projects', pinned: !p.pinned } }); }
    catch (e) { toast(e.message); pin.disabled = false; return; }
    await loadRepos(true);
  };
  if (open) fillOpen(c, p);
  return c;
}

function toggleProject(name) {
  openProject = openProject === name ? null : name;
  try { localStorage.setItem('vp.repos.open', openProject || ''); } catch (e) {}
  renderRepos(reposList);
  if (openProject) {
    const card = document.querySelector('.rcard.open');
    if (card) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
}

/* The open project's agent toggle, its actions, and the terminal's place. */
function fillOpen(card, p) {
  const agent = repoAgent(p), a = p.agents[agent] || {};
  const seg = card.querySelector('.aseg');
  for (const [id, st] of Object.entries(p.agents)) {
    const b = document.createElement('button');
    b.className = id === agent ? 'on' : '';
    b.innerHTML = '<span class="dot' + (st.up ? ' on' : '') + '"></span>' + esc(agentShort(id));
    b.title = st.up ? 'running' : 'not running';
    b.onclick = e => {
      e.stopPropagation();
      try { localStorage.setItem('vp.agent.' + p.name, id); } catch (err) {}
      renderRepos(reposList);
    };
    seg.appendChild(b);
  }
  const bar = card.querySelector('.rbar');
  const act = (label, cls, fn) => {
    const b = document.createElement('button');
    b.innerHTML = label;
    b.className = 'ract ' + (cls || '');
    b.onclick = e => { e.stopPropagation(); fn(b); };
    bar.appendChild(b);
    return b;
  };
  // Into this project's voice view, on the agent picked above — the same
  // switch the operator's open_project makes.
  const voice = () => {
    if (!voiceOn) return;
    act('&#127908; Voice', '', () => {
      try { localStorage.setItem('vp.agent.' + p.name, agent); } catch (e) {}
      setView('project', p.name);
    }).title = 'Talk about ' + p.name + ' (' + agentShort(agent) + ') by voice';
  };
  if (!a.up) {
    act('Start ' + esc(agentShort(agent)), 'start', b => control(b, 'start_agent', p.name, agent,
      null, agentShort(agent) + ' started in ' + p.name));
    voice();
    card.insertAdjacentHTML('beforeend', '<div class="rnote">' + esc(agentShort(agent)) +
                            ' isn\u2019t running in ' + esc(p.name) + '.</div>');
    return;
  }
  act('Terminal &#10530;', 'term', () => openTerminal(p.name, agent));
  voice();
  act('Stop', 'stop', b => control(b, 'stop_agent', p.name, agent,
    'Stop ' + p.name + "'s " + agentShort(agent) + ' session?\n\nThis kills the tmux session ' +
    'and the agent in it, mid-turn or not.', 'stopped ' + p.name + "'s " + agentShort(agent)));
}

async function control(b, action, project, agent, ask, done) {
  if (ask && !confirm(ask)) return;
  b.disabled = true;
  try {
    await api('/api/control', { body: { action, project, agent } });
    toast(done);
  } catch (e) { toast(e.message); b.disabled = false; return; }
  await loadRepos(true);
}

/* ---------- the live terminal ---------- */
/* xterm.js (terminal/'s vendored copy, served at /vendor/), loaded the first
   time a terminal opens. The wire format is terminal/'s: PTY bytes down as
   binary frames, keystrokes and resizes up as JSON. */
let xtermReady = null;
function loadXterm() {
  if (xtermReady) return xtermReady;
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = '/vendor/xterm.css';
  document.head.appendChild(css);
  const one = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('could not load ' + src));
    document.head.appendChild(s);
  });
  xtermReady = one('/vendor/xterm.js').then(() => Promise.all(
    ['/vendor/addon-fit.js', '/vendor/addon-unicode11.js', '/vendor/addon-web-links.js'].map(one)));
  return xtermReady;
}
const isTouch = (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) &&
                matchMedia('(hover: none)').matches;
const TERM_THEME = {
  background: '#0b0e14', foreground: '#d5dae2', cursor: '#7fd88f', cursorAccent: '#0b0e14',
  selectionBackground: '#2b3646',
  black: '#0b0e14', brightBlack: '#5c6675', red: '#f06c75', brightRed: '#ff8b91',
  green: '#7fd88f', brightGreen: '#9ff0ad', yellow: '#e3c07b', brightYellow: '#f5d99a',
  blue: '#61afef', brightBlue: '#8ac6ff', magenta: '#c678dd', brightMagenta: '#e0a0f0',
  cyan: '#56b6c2', brightCyan: '#7fd3de', white: '#d5dae2', brightWhite: '#ffffff',
};

/* The image in a paste or a drop, if there is one. */
function imageIn(data) {
  if (!data) return null;
  for (const item of data.items || []) {
    if (item.kind === 'file' && item.type.startsWith('image/')) return item.getAsFile();
  }
  return null;
}

/* Claude reads PNG, JPEG, GIF and WebP. Anything else the browser can show —
   an iPhone's HEIC — is redrawn as a JPEG first. */
const CLAUDE_IMAGES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
async function claudeImage(blob) {
  if (CLAUDE_IMAGES.includes(blob.type)) return blob;
  const bitmap = await createImageBitmap(blob);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0);
  return new Promise((ok, fail) => canvas.toBlob(
    b => (b ? ok(b) : fail(new Error("couldn't convert the image"))), 'image/jpeg', 0.9));
}

class LiveTerm {
  constructor(project, agent) {
    this.project = project;
    this.agent = agent;
    this.key = project + '/' + agent;
    this.host = document.createElement('div');
    this.host.className = 'lterm';
    this.host.innerHTML = '<div class="lscreen"></div><div class="lnote" hidden></div>' +
      '<div class="lkeys">' +
      '<button data-send="\x1b">esc</button><button data-send="\t">tab</button>' +
      '<button data-ctrl>ctrl</button><button data-arrow="A">&#8593;</button>' +
      '<button data-arrow="B">&#8595;</button><button data-arrow="D">&#8592;</button>' +
      '<button data-arrow="C">&#8594;</button><button data-paste>paste</button>' +
      '<button data-image title="Send the agent a photo or screenshot">image</button>' +
      '<button data-send="\r" class="wide">&#9166;</button></div>';
    this.screen = this.host.querySelector('.lscreen');
    this.note = this.host.querySelector('.lnote');
    this.ctrl = false;
    this.disposed = false;
    this.retry = 0;
    this.keys();
    loadXterm().then(() => this.start()).catch(e => this.say(e.message));
  }

  start() {
    if (this.disposed) return;
    this.term = new Terminal({
      fontSize: isTouch ? 10 : 12, lineHeight: 1.15, cursorBlink: true, scrollback: 5000,
      fontFamily: '"SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace',
      allowProposedApi: true, macOptionIsMeta: true, theme: TERM_THEME,
    });
    this.fitter = new FitAddon.FitAddon();
    this.term.loadAddon(this.fitter);
    this.term.loadAddon(new WebLinksAddon.WebLinksAddon());
    try { this.term.loadAddon(new Unicode11Addon.Unicode11Addon()); this.term.unicode.activeVersion = '11'; }
    catch (e) {}
    this.term.open(this.screen);
    this.term.onData(d => {
      if (this.ctrl && d.length === 1) { this.setCtrl(false); return this.send({ t: 'i', d: ctrlChar(d) }); }
      this.send({ t: 'i', d });
    });
    this.term.onBinary(d => this.send({ t: 'ib', d: btoa(d) }));
    this.touch();
    this.images();
    this.observer = new ResizeObserver(() => this.fit());
    this.observer.observe(this.screen);
    this.fit();
    this.connect();
  }

  connect() {
    if (this.disposed) return;
    const q = new URLSearchParams({ project: this.project, agent: this.agent,
                                    cols: this.term.cols, rows: this.term.rows });
    const tok = localStorage.getItem('vp.token');
    if (tok) q.set('token', tok);
    const ws = this.ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') +
                                       location.host + '/ws/attach?' + q);
    ws.binaryType = 'arraybuffer';
    this.ended = null;
    ws.onopen = () => { this.retry = 0; this.say(null); this.fit(); };
    ws.onmessage = e => {
      if (typeof e.data !== 'string') { this.term.write(new Uint8Array(e.data)); return; }
      let m = {};
      try { m = JSON.parse(e.data); } catch (err) {}
      if (m.t === 'error') this.ended = m.message;
      else if (m.t === 'exit') this.ended = 'detached — the session ended or was left';
    };
    ws.onclose = () => {
      if (this.disposed) return;
      if (this.ended) { this.say(this.ended + ' · tap to reattach'); return; }
      // A dropped connection (a phone asleep, wifi gone): attach again, which
      // tmux answers with a full repaint.
      this.say('reconnecting…');
      setTimeout(() => this.connect(), Math.min(8000, 800 * 2 ** this.retry++));
    };
  }

  send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); }

  fit() {
    if (!this.term || !this.screen.clientWidth) return;
    try { this.fitter.fit(); } catch (e) { return; }
    if (this.term.cols !== this.sent?.[0] || this.term.rows !== this.sent?.[1]) {
      this.sent = [this.term.cols, this.term.rows];
      this.send({ t: 'resize', cols: this.term.cols, rows: this.term.rows });
    }
  }

  mounted() { requestAnimationFrame(() => { this.fit(); if (this.term) this.term.refresh(0, this.term.rows - 1); }); }

  say(text) {
    this.note.hidden = !text;
    this.note.textContent = text || '';
    this.note.onclick = this.ended ? () => { this.say('attaching…'); this.connect(); } : null;
  }

  setCtrl(on) { this.ctrl = on; this.host.querySelector('[data-ctrl]').classList.toggle('on', on); }

  arrow(l) { return (this.term && this.term.modes.applicationCursorKeysMode ? '\x1bO' : '\x1b[') + l; }

  /* The key row: keys a phone keyboard hasn't got. Taps never take focus, so
     the keyboard stays as it was. */
  keys() {
    const row = this.host.querySelector('.lkeys');
    if (!isTouch) row.hidden = true;
    for (const type of ['pointerdown', 'mousedown', 'touchstart', 'click'])
      row.addEventListener(type, e => { if (e.target.closest('button')) e.preventDefault(); }, { passive: false });
    row.addEventListener('pointerdown', async e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-ctrl')) return this.setCtrl(!this.ctrl);
      if (b.hasAttribute('data-image')) return;
      if (b.hasAttribute('data-paste')) {
        if (await this.pasteClipboard()) return;
        let text = null;
        try { text = await navigator.clipboard.readText(); } catch (err) { text = prompt('Paste:'); }
        if (text) this.send({ t: 'i', d: text });
        return;
      }
      const d = b.dataset.send !== undefined ? b.dataset.send : this.arrow(b.dataset.arrow);
      this.setCtrl(false);
      this.send({ t: 'i', d });
    });
    // On a touch screen only the lift counts as a gesture, and a file picker
    // opens for nothing less.
    row.addEventListener('pointerup', e => {
      if (e.target.closest('[data-image]')) this.pickImage();
    });
  }

  /* Images. The agent can't see this device's clipboard or photos, so an
     image is uploaded (/api/image), saved where the agent can read it, and
     its path pasted into the terminal — which Claude Code turns into an
     attached image, as Ctrl+V does at the desk. From the image key (photos,
     camera, files), the paste key when the clipboard holds an image, a
     browser paste, or a drop on the terminal. */
  images() {
    this.screen.addEventListener('paste', e => {
      const file = imageIn(e.clipboardData);
      if (!file) return;
      e.preventDefault();
      e.stopPropagation();
      this.sendImage(file);
    }, true);
    this.screen.addEventListener('dragover', e => e.preventDefault());
    this.screen.addEventListener('drop', e => {
      const file = imageIn(e.dataTransfer);
      if (!file) return;
      e.preventDefault();
      this.sendImage(file);
    });
  }

  pickImage() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = () => { if (input.files[0]) this.sendImage(input.files[0]); };
    input.click();
  }

  /* The paste key, where the browser lets the page read the clipboard whole:
     an image goes up, text is typed. One read, so iOS asks once. False when
     it can't, for the text-only fallback. */
  async pasteClipboard() {
    if (!navigator.clipboard || !navigator.clipboard.read) return false;
    let items;
    try { items = await navigator.clipboard.read(); } catch (e) { return false; }
    for (const item of items) {
      const type = item.types.find(t => t.startsWith('image/'));
      if (type) { this.sendImage(await item.getType(type)); return true; }
    }
    for (const item of items) {
      if (!item.types.includes('text/plain')) continue;
      const text = await (await item.getType('text/plain')).text();
      if (text) this.term.paste(text);
      return true;
    }
    return true;
  }

  async sendImage(blob) {
    this.say('sending image…');
    try {
      const body = await claudeImage(blob);
      const q = new URLSearchParams({ project: this.project, agent: this.agent });
      const d = await api('/api/image?' + q, { method: 'POST', headers: { 'Content-Type': body.type }, body });
      this.say(null);
      // term.paste, not a plain send: bracketed paste is how Claude Code tells
      // a pasted path from typing.
      this.term.paste(d.path);
    } catch (e) {
      this.say('image not sent: ' + e.message);
      setTimeout(() => { if (!this.ended) this.say(null); }, 4000);
    }
  }

  /* A drag scrolls: the app's own scrolling when it took the mouse (tmux with
     mouse on, Claude), arrow keys in a full-screen app that didn't, else
     xterm's scrollback. A flick glides on after the finger lifts, as a native
     scroll does. A tap raises the keyboard. */
  touch() {
    let drag = null, residue = 0, velocity = 0, frame = 0;
    const el = this.screen, term = this.term;
    const cell = () => { const s = el.querySelector('.xterm-screen'); return s ? s.getBoundingClientRect().height / term.rows : 16; };
    const lines = n => {
      if (term.modes.mouseTrackingMode !== 'none') {
        term.element.dispatchEvent(new WheelEvent('wheel', { deltaY: n * cell(), deltaMode: 0,
          clientX: drag ? drag.x : 0, clientY: drag ? drag.y : 0, bubbles: true, cancelable: true }));
      } else if (term.buffer.active.type === 'alternate') {
        this.send({ t: 'i', d: this.arrow(n < 0 ? 'A' : 'B').repeat(Math.min(8, Math.abs(n))) });
      } else term.scrollLines(n);
    };
    const pixels = px => {
      residue += px;
      const n = Math.trunc(residue / cell());
      if (n) { residue -= n * cell(); lines(n); }
    };
    const stop = () => { cancelAnimationFrame(frame); frame = 0; velocity = 0; };
    // ~0.5 s of glide from a firm flick, in px/ms; 16 ms a frame.
    const glide = () => {
      frame = requestAnimationFrame(() => {
        velocity *= 0.94;
        if (this.disposed || Math.abs(velocity) < 0.02) return stop();
        pixels(-velocity * 16);
        glide();
      });
    };
    el.addEventListener('touchstart', e => {
      stop();
      if (e.touches.length !== 1) { drag = null; return; }
      residue = 0;
      drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: 0, at: e.timeStamp, v: 0 };
    }, { passive: true });
    el.addEventListener('touchmove', e => {
      if (!drag || e.touches.length !== 1) return;
      const y = e.touches[0].clientY, dy = y - drag.y;
      const dt = Math.max(1, e.timeStamp - drag.at);
      // Smoothed, so one jittery last sample doesn't decide the flick.
      drag.v = 0.7 * (dy / dt) + 0.3 * drag.v;
      drag.y = y; drag.at = e.timeStamp; drag.moved += Math.abs(dy);
      pixels(-dy);
      e.preventDefault();
    }, { passive: false });
    el.addEventListener('touchend', e => {
      if (drag && drag.moved < 8 && !term.hasSelection()) term.focus();
      // No glide once the drag has decayed into arrow keys (it would keep
      // walking a menu), or when the finger stopped before it lifted.
      const canGlide = term.modes.mouseTrackingMode !== 'none' || term.buffer.active.type !== 'alternate';
      if (canGlide && drag && drag.moved > 8 && e.timeStamp - drag.at < 80 && Math.abs(drag.v) > 0.15) {
        velocity = drag.v;
        glide();
      }
      drag = null;
    }, { passive: true });
  }

  dispose() {
    this.disposed = true;
    if (this.ws) this.ws.close();
    if (this.observer) this.observer.disconnect();
    if (this.term) this.term.dispose();
    this.host.remove();
  }
}

function ctrlChar(ch) {
  const c = ch.toUpperCase().charCodeAt(0);
  if (c >= 64 && c <= 95) return String.fromCharCode(c - 64);
  return ch === ' ' ? '\x00' : ch === '?' ? '\x7f' : ch;
}

/* ---------- Tickets: your Jira tickets, read-only ---------- */
/* The config's JQL — your open tickets by default — grouped by where they are
   in their workflow, each with the projects linked to it (explicitly, or by a
   branch that names it). Details on tap; changing a ticket is the desktop's
   and `proj jira`'s job. */
let ticketsTimer = null, ticketsSig = '';
const ticketOpen = new Set(), ticketCache = {};

function startTickets() { if (!ticketsTimer) ticketsTimer = setInterval(() => loadTickets(), 120000); }
function stopTickets() { clearInterval(ticketsTimer); ticketsTimer = null; }

async function loadTickets(force) {
  let d;
  if (!ticketsSig) $('ticketsInner').innerHTML = '<p class="hnote pending">loading</p>';
  try { d = await api('/api/tickets'); }
  catch (e) {
    $('ticketsInner').innerHTML = '<p class="hnote">' + esc(e.message) + '</p>';
    ticketsSig = '';
    return;
  }
  const sig = JSON.stringify(d);
  if (force || sig !== ticketsSig) { ticketsSig = sig; renderTickets(d.issues, d.linked || {}); }
}

function renderTickets(issues, linked) {
  const box = $('ticketsInner');
  const keep = $('tickets').scrollTop;
  box.innerHTML = '';
  if (!issues.length) { box.innerHTML = '<p class="hnote">No tickets match.</p>'; return; }
  const cats = [['indeterminate', 'In progress'], ['new', 'To do'], ['done', 'Done'], ['', 'Other']];
  for (const [cat, title] of cats) {
    const items = issues.filter(i => cat ? i.category === cat
                                         : !['indeterminate', 'new', 'done'].includes(i.category));
    if (!items.length) continue;
    const h = document.createElement('div');
    h.className = 'hsec';
    h.textContent = title + ' · ' + items.length;
    box.appendChild(h);
    const g = document.createElement('div');
    g.className = 'hgrid';
    items.forEach(i => g.appendChild(ticketCard(i, linked[i.key] || [])));
    box.appendChild(g);
  }
  $('tickets').scrollTop = keep;
}

function ticketCard(i, projects) {
  const c = document.createElement('div');
  c.className = 'acard tcard cat-' + (i.category || 'other');
  const upd = Date.parse(i.updated);
  const meta = [];
  if (projects.length) meta.push('→ ' + projects.join(', '));
  if (i.priority) meta.push(i.priority);
  meta.push(i.assignee || 'unassigned');
  const open = ticketOpen.has(i.key);
  c.innerHTML = '<div class="ahead"><span class="apill">' + esc(i.status) + '</span>' +
    '<span class="aname">' + esc(i.key) + '</span><span class="achip">' + esc(i.type) + '</span>' +
    (Number.isFinite(upd) ? '<span class="atime" data-since="' + (upd / 1000) + '">' + ago(upd / 1000) + '</span>' : '') +
    '</div><div class="asum">' + esc(i.summary) + '</div>' +
    '<div class="ameta">' + esc(meta.join(' · ')) + '</div>' +
    '<div class="abtns"><button data-act="more">' + (open ? 'Less' : 'More') + '</button>' +
    '<a class="rweb" style="margin-left:0" target="_blank" rel="noopener" href="' + esc(i.url) +
    '">Open in Jira &#8599;</a></div><div class="adetail"' + (open ? '' : ' hidden') + '></div>';
  const detail = c.querySelector('.adetail'), more = c.querySelector('[data-act=more]');
  if (open) fillTicket(detail, i.key);
  more.onclick = () => {
    const show = detail.hidden;
    detail.hidden = !show;
    more.textContent = show ? 'Less' : 'More';
    if (show) { ticketOpen.add(i.key); fillTicket(detail, i.key); }
    else ticketOpen.delete(i.key);
  };
  return c;
}

async function fillTicket(box, key) {
  let t = ticketCache[key];
  if (!t) {
    box.innerHTML = '<p class="hnote pending">loading</p>';
    try { t = ticketCache[key] = await api('/api/ticket?key=' + encodeURIComponent(key)); }
    catch (e) { box.innerHTML = '<p class="hnote">' + esc(e.message) + '</p>'; return; }
  }
  let h = '<span class="alabel">description</span><div class="tdesc">' +
          esc(t.description || '(none)') + '</div>';
  for (const cm of (t.comments || []).slice(-5)) {
    h += '<div class="tcomment"><span class="alabel">' + esc(cm.author) + ' · ' +
         esc((cm.created || '').slice(0, 16).replace('T', ' ')) + '</span>' + esc(cm.body || '') + '</div>';
  }
  box.innerHTML = h;
}

/* ---------- views ---------- */
/* Which conversation is on screen. The operator is stored like any project's,
   under a reserved key, so history, reset and the chat turn itself all take the
   same path either way. */
function keyFor(v) { return v === 'projects' ? OPERATOR : current; }
function chatKey() { return keyFor(view); }

const LIST_VIEWS = ['home', 'repos', 'tickets'];
const VIEW_TITLE = { home: 'Agents', repos: 'Projects', tickets: 'Tickets', projects: 'Operator' };

async function setView(v, name) {
  if (!voiceOn && !LIST_VIEWS.includes(v)) v = 'home';
  if (v === 'tickets' && !jiraOn) v = 'home';
  if (v === 'projects' && !operatorOn) v = 'project';
  if (v === 'project') {
    if (name) current = name;
    if (!current) { toast('No projects found.'); return; }
    localStorage.setItem('vp.project', current);
    $('project').value = current;
  }
  view = v;
  localStorage.setItem('vp.view', v);
  document.body.classList.toggle('viewProjects', v === 'projects');
  document.body.classList.toggle('viewProject', v === 'project');
  document.body.classList.toggle('viewHome', v === 'home');
  document.body.classList.toggle('viewRepos', v === 'repos');
  document.body.classList.toggle('viewTickets', v === 'tickets');
  document.body.classList.toggle('viewList', LIST_VIEWS.includes(v));
  $('viewTitle').textContent = VIEW_TITLE[v] || '';
  if (!LIST_VIEWS.includes(v)) localStorage.setItem('vp.talkView', v);
  history.replaceState(null, '', LIST_VIEWS.includes(v) ? '#' + v : location.pathname);
  for (const b of document.querySelectorAll('#tabs button'))
    b.classList.toggle('on', b.dataset.tab === (LIST_VIEWS.includes(v) ? v : 'talk'));
  // Wide, every column stays up and this only says which one the mic feeds.
  $('paneOperator').classList.toggle('focus', v === 'projects');
  $('paneProject').classList.toggle('focus', v === 'project');
  $('paneProjectName').textContent = current || 'project';
  updateTarget();
  // Each view owns its own pollers; leaving one must not leave them running.
  stopUpdates();
  stopOverview();
  stopHome();
  stopRepos();
  stopTickets();
  clearSummaryPending();
  pendingSummary = null;
  if (LIST_VIEWS.includes(v)) {
    // No composer on a list, so nothing for a hands-free loop to talk to: a
    // mic reopening behind the cards would send to a conversation off screen.
    if (handsFree) setConvo(false);
    if (v === 'home') { await loadHome(true); startHome(); }
    else if (v === 'repos') { await loadRepos(true); startRepos(); }
    else { await loadTickets(true); startTickets(); }
    return;
  }
  // In the overview, Status means "across all of them".
  $('btnStatus').innerHTML = v === 'projects' ? '&#128202; Round-up' : '&#128202; Status';
  if (v === 'projects') {
    setDest('advisor');            // there is no single agent to send to here
    // Only summaries that land from now on: entering the view shouldn't
    // replay every agent reply since the server started.
    lastOverviewTs = Date.now() / 1000;
    await loadOperatorChat();
    await loadOverview();
    startOverview();
    // The other columns are still on screen when there's room for them.
    if (current) await selectProject(current);
  } else {
    await selectProject(current);
    if (operatorOn) {
      await loadOperatorChat();
      await loadOverview();
      startOverview();
    }
  }
}

async function loadOperatorChat() {
  const h = await api('/api/history?project=' + encodeURIComponent(OPERATOR));
  renderHistory(h.messages, 'projects');
}

/* ---------- third column: the project's own web app ---------- */
/* The project list knows the port; only the browser knows the right host. A
   project bound to localhost is reachable at the desk and not from the phone,
   so a loopback host is rewritten to whatever host this page came from. */
function webUrl(t) {
  if (!t) return null;
  let host = t.host;
  const loopback = !host || /^(localhost|127\.|::1|\[::1\])/.test(host);
  const weAreLocal = /^(localhost|127\.|\[?::1)/.test(location.hostname);
  if (loopback && !weAreLocal) host = location.hostname;
  return t.scheme + '://' + (host || location.hostname) + ':' + t.port + (t.path || '/');
}
/* A page on HTTPS may not frame plain HTTP — the browser blocks it silently,
   so say so rather than showing an empty rectangle. */
function canEmbed(url) {
  return !(location.protocol === 'https:' && url.startsWith('http:'));
}

function showWeb(p) {
  const frame = $('webFrame'), note = $('webNote'), tabs = $('webTabs');
  tabs.innerHTML = '';
  webTargets = [];
  const web = p && p.web;
  $('webTitle').textContent = web && web.desc ? web.desc : (p ? p.name : '');
  if (!web) {
    frame.classList.remove('show');
    frame.removeAttribute('src');
    note.style.display = '';
    note.innerHTML = p
      ? esc(p.name) + ' has no <code>web_port</code> in the project list, so there is no page to show.'
      : '';
    return;
  }
  webTargets = [web.main].concat(web.extra || []);
  if (webTargets.length > 1) {
    webTargets.forEach((t, i) => {
      const b = document.createElement('button');
      b.textContent = t.name || 'main';
      b.onclick = () => openWebTab(i);
      tabs.appendChild(b);
    });
  }
  openWebTab(0);
}

function openWebTab(i) {
  const t = webTargets[i];
  if (!t) return;
  webIndex = i;
  [...$('webTabs').children].forEach((b, j) => b.classList.toggle('on', j === i));
  const url = webUrl(t);
  $('webOpen').onclick = () => window.open(url, '_blank', 'noopener');
  const frame = $('webFrame'), note = $('webNote');
  if (canEmbed(url)) {
    note.style.display = 'none';
    frame.classList.add('show');
    frame.src = url;
    return;
  }
  frame.classList.remove('show');
  frame.removeAttribute('src');
  note.style.display = '';
  note.innerHTML =
    'This page is served over HTTPS — the microphone needs a secure context — and ' +
    '<code>' + esc(url) + '</code> is plain HTTP, so the browser refuses to embed it.' +
    '<br><br><a href="' + esc(url) + '" target="_blank" rel="noopener">Open it in a tab &#8599;</a>' +
    '<br><br>To have it inline, reach voice_prompt over http from this machine ' +
    '(<code>http://localhost:' + esc(String(httpPort)) + '</code>, which is exempt from the ' +
    'redirect), or put the project behind TLS as well.';
}
$('webReload').onclick = () => openWebTab(webIndex);
$('rosterToggle').onclick = () => document.body.classList.toggle('wideRoster');

/* ---------- tiles: the selected projects, in the project column ---------- */
function renderTiles(list) {
  const box = $('tiles');
  box.innerHTML = '';
  const picked = list.filter(p => p.selected);
  if (!picked.length) {
    const d = document.createElement('div');
    d.id = 'tilesEmpty';
    d.textContent = 'Nothing selected — ask the operator to watch some projects, or tap All…';
    box.appendChild(d);
    return;
  }
  for (const p of picked) {
    const b = document.createElement('button');
    b.className = 'tile' + (p.name === current ? ' on' : '');
    const baseMeta = p.watching ? 'working…' : p.alive ? 'session up' : 'not running';
    const pu = fmtProjUsage(p.usage);
    const meta = pu ? baseMeta + ' · ' + pu : baseMeta;
    b.innerHTML = '<div class="tname"><span class="dot' + (p.alive ? ' on' : '') + '"></span>' +
                  esc(p.name) + agentChips(p) + '</div><div class="tmeta' + (p.watching ? ' busy' : '') + '">' +
                  esc(meta) + '</div>';
    b.onclick = () => setView('project', p.name);
    box.appendChild(b);
  }
}

/* An advisor asked for the screen to move (open_project / open_projects_view).
   Applied once its reply has been read out, so the words and the change land
   together rather than the screen jumping mid-sentence. */
async function applyNav(nav) {
  if (!nav || !nav.view) return;
  if (nav.view === 'project' && nav.project) {
    if (nav.agent) localStorage.setItem('vp.agent.' + nav.project, nav.agent);
    await setView('project', nav.project);
    toast('Opened ' + nav.project + (nav.agent ? ' · ' + agentShort(nav.agent) : ''));
  } else if (nav.view === 'projects') {
    await setView('projects');
    toast('Back to all projects');
  }
}

function startOverview() { if (!ovTimer) ovTimer = setInterval(pollOverview, 5000); }
function stopOverview() { clearInterval(ovTimer); ovTimer = null; }

async function loadOverview() {
  const d = await api('/api/overview?after=' + lastOverviewTs);
  if (d.services) {
    lastServices = d.services;
    const ubox = $('projectsUsage');
    if (ubox) {
      ubox.innerHTML = '';
      const sgrid = renderServices(d.services);
      if (sgrid) ubox.appendChild(sgrid);
    }
  }
  renderCards(d.projects || []);
  return d;
}

/* Poll for what changed while you're watching everything at once: liveness,
   which agents are working, and any summary that landed in a selected project.
   Without this the overview would be the one screen that never tells you an
   agent finished. */
async function pollOverview() {
  if (!operatorOn) return;
  let d;
  try { d = await loadOverview(); } catch (e) { return; }   // transient
  for (const m of (d.summaries || [])) {
    lastOverviewTs = Math.max(lastOverviewTs, m.ts || 0);
    pauseMusicForSummary();
    addSummaryBubble(m.text, m.project, undefined, m.agent);
    if (speakOn && view === 'projects' && !busy && !listening && !ttsActive)
      speakText(m.project + (m.agent && m.agent !== DEFAULT_AGENT ? ', ' + agentShort(m.agent) : '') +
                '. ' + m.text);
  }
}

function renderCards(list) {
  projects = list;
  const box = $('projectCards');
  box.innerHTML = '';
  // Pinned first; each group keeps the server's order.
  const pinned = list.filter(p => p.pinned);
  for (const p of [...pinned, ...list.filter(p => !p.pinned)]) {
    const card = document.createElement('div');
    card.className = 'pcard' + (p.selected ? ' sel' : '');

    const tick = document.createElement('button');
    tick.className = 'psel';
    tick.textContent = '✓';
    tick.title = p.selected ? 'Stop watching this' : 'Watch this';
    tick.onclick = () => toggleSelected(p.name, !p.selected);

    const main = document.createElement('div');
    main.className = 'pmain';
    const name = document.createElement('div');
    name.className = 'pname';
    name.innerHTML = '<span class="dot' + (p.alive ? ' on' : '') + '"></span>';
    name.appendChild(document.createTextNode(p.name));
    name.insertAdjacentHTML('beforeend', agentChips(p));
    const meta = document.createElement('div');
    meta.className = 'pmeta' + (p.watching ? ' busy' : '');
    const baseMeta = p.watching ? 'agent working…'
                   : p.alive ? 'session up' : 'not running';
    const pu = fmtProjUsage(p.usage);
    meta.textContent = pu ? baseMeta + ' · ' + pu : baseMeta;
    if (pu) meta.title = pu;
    main.appendChild(name);
    main.appendChild(meta);

    const dive = document.createElement('button');
    dive.className = 'pdive';
    dive.textContent = 'Open ›';
    dive.onclick = () => setView('project', p.name);

    card.appendChild(tick);
    card.appendChild(main);
    card.appendChild(dive);
    box.appendChild(card);
  }
  const strip = $('projectsPinned');
  strip.innerHTML = '';
  for (const p of pinned) {
    const chip = document.createElement('button');
    chip.title = 'Open ' + p.name;
    chip.innerHTML = '<span class="dot' + (p.alive ? ' on' : '') + '"></span>';
    chip.appendChild(document.createTextNode(p.name));
    chip.onclick = () => setView('project', p.name);
    strip.appendChild(chip);
  }
  const n = list.filter(p => p.selected).length;
  $('projectsCount').textContent =
    n + ' of ' + list.length + ' watched' + (n ? '' : ' — the operator sees nothing');
  // Keep the project picker in step; it's the same roster.
  const sel = $('project');
  sel.innerHTML = '';
  for (const p of list) {
    const o = document.createElement('option');
    o.value = p.name;
    o.textContent = (p.alive ? '● ' : '○ ') + p.name;
    sel.appendChild(o);
  }
  if (!current && list.length) current = list[0].name;
  if (current) sel.value = current;
  renderTiles(list);
  updateTarget();
  const cur = list.find(p => p.name === current);
  if (cur && cur.name !== showWeb._for) { showWeb._for = cur.name; showWeb(cur); }
}

async function setSelection(payload) {
  try { await api('/api/selection', { body: payload }); }
  catch (e) { toast(e.message); return; }
  await loadOverview();
}
const toggleSelected = (name, on) => setSelection(on ? { add: [name] } : { remove: [name] });
/* Narrow only: the bar folds the roster. Unfolding takes height from the chat,
   so keep its latest reply in view across the change. */
function setProjectsOpen(open) {
  const chat = $('chatOperator');
  const atEnd = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
  $('projects').classList.toggle('open', open);
  try { localStorage.setItem('vp.projectsOpen', open ? '1' : ''); } catch (e) {}
  if (atEnd) chat.scrollTop = chat.scrollHeight;
}
try { if (localStorage.getItem('vp.projectsOpen')) $('projects').classList.add('open'); } catch (e) {}
$('projectsBar').addEventListener('click', e => {
  if (e.target.closest('button') || matchMedia('(min-width: 1100px)').matches) return;
  setProjectsOpen(!$('projects').classList.contains('open'));
});
$('selAll').onclick = () => setSelection({ selected: projects.map(p => p.name) });
$('selNone').onclick = () => setSelection({ selected: [] });
for (const b of document.querySelectorAll('#tabs button')) {
  b.onclick = () => {
    const t = b.dataset.tab;
    if (t !== 'talk') return setView(t);
    const last = localStorage.getItem('vp.talkView');
    setView(last === 'projects' && operatorOn ? 'projects' : 'project');

}

/* ---------- projects ---------- */
async function loadProjects(keep) {
  const data = await api('/api/projects');
  projects = data.projects;
  const sel = $('project');
  sel.innerHTML = '';
  for (const p of projects) {
    const o = document.createElement('option');
    o.value = p.name;
    o.textContent = (p.alive ? '● ' : '○ ') + p.name;
    sel.appendChild(o);
  }
  const want = keep || current || localStorage.getItem('vp.project');
  if (want && projects.some(p => p.name === want)) sel.value = want;
  current = sel.value || null;
}
async function selectProject(name) {
  current = name;
  localStorage.setItem('vp.project', name);
  const p = projects.find(x => x.name === name);
  $('dot').className = 'dot' + (p && p.alive ? ' on' : '');
  $('paneProjectName').textContent = name;
  renderTiles(projects);
  if (p && showWeb._for !== name) { showWeb._for = name; showWeb(p); }
  stopUpdates();
  pendingSummary = null;
  const h = await api('/api/history?project=' + encodeURIComponent(name));
  renderHistory(h.messages, 'project');
  lastSummaryTs = h.messages.reduce(
    (t, m) => m.role === 'summary' ? Math.max(t, m.ts || 0) : t, 0);
  pollUpdates();  // picks up a watch already running (e.g. after a reload)
}

$('termRow').onclick = () => { if (current) openTerminal(current, currentAgent()); };

/* ---------- sending ---------- */
function setBusy(b) {
  busy = b;
  for (const id of ['send', 'btnStatus', 'btnBrainstorm']) $(id).disabled = b;
}
async function askAdvisor(mode, message) {
  if (busy || view === 'home') return;
  if (view === 'project' && !current) return;
  setBusy(true);
  const asked = view;               // the reply belongs to the view that asked
  /* Two independent switches. Speak decides whether the reply is read aloud,
     and carries to the server as `voice` because VOICE_NOTE there asks for
     prose written for the ear — no markdown. Convo decides only whether the mic
     reopens afterwards, so Convo with Speak off is a conversation you talk into
     and read back. */
  const speak = speakOn;
  const label = mode === 'status'
    ? (asked === 'projects' ? 'Round-up' : 'Status update')
    : (message || 'Brainstorm next steps');
  addBubble('user', inline(label),
    mode === 'status' ? '📊 status' : mode === 'brainstorm' ? '💡 brainstorm' : null, asked);
  const pend = addBubble('advisor pending', 'thinking', null, asked);
  if (speak || handsFree) setVoiceState('thinking');
  try {
    const body = asked === 'projects'
      ? { scope: 'operator', mode, message, voice: speak }
      : { project: current, agent: currentAgent(), mode, message, voice: speak };
    const d = await api('/api/chat', { body });
    pend.remove();
    // The advisor may have changed the speed this turn; the reply speaks at it.
    if (d.tts_rate) setTtsRate(d.tts_rate);
    // The operator may have changed the working set as part of the turn.
    if (d.selected && view === 'projects') loadOverview().catch(() => {});
    // Prompts the advisor submitted itself (MCP send tool) during this turn.
    for (const s of (d.sent || [])) addBubble('sent', md(s.text), sentTag(s.agent), asked);
    addAdvisorBubble(d.reply, asked);
    if (d.sent && d.sent.length) watchForSummary();
    setBusy(false);
    if (speak) await speakText(d.reply);
    // After the words, not before: the reply is what explains the move.
    if (d.nav) await applyNav(d.nav);
    if (handsFree) startListen();   // sets the strip back to "listening"
    else setVoiceState(null);
  } catch (e) {
    pend.remove();
    addBubble('err', esc(e.message), null, asked);
    setBusy(false);
    setVoiceState(null);
    if (handsFree) setConvo(false);
  }
}
async function sendProject(text) {
  if (busy || !current || view === 'home') return;
  const short = text.length > 220 ? text.slice(0, 220) + '…' : text;
  const agent = currentAgent();
  if (!confirm('Send this prompt to the "' + current + '" ' +
               (instancesOf(current).find(i => i.id === agent) || { label: 'coding' }).label + ' agent?\n\n' + short)) return;
  setBusy(true);
  try {
    await api('/api/send', { body: { project: current, agent, text } });
    addBubble('sent', md(text), sentTag(agent));
    $('input').value = '';
    autogrow();
    watchForSummary();
  } catch (e) {
    addBubble('err', esc(e.message));
  }
  setBusy(false);
}

/* ---------- voice settings ---------- */
/* One sheet for the three choices that differ per browser: which recognizer
   takes dictation, which engine reads replies back, and in which voice. All of
   it is per-browser and lives in localStorage — the phone and the desktop want
   different answers. */

async function loadKokoroVoices() {
  if (!serverTTS) return;
  try {
    const d = await api('/api/voices');
    kokoroVoices = d.voices || [];
    kokoroErr = kokoroVoices.length ? '' : 'the TTS server listed no voices';
  } catch (e) {
    kokoroVoices = [];
    kokoroErr = e.message;
  }
  if (!$('sheet').hidden) fillVoices();
}

/* af_heart -> "Heart — American female". Kokoro names its voices <language
   letter><gender letter>_<name>; anything that doesn't fit shows as-is. */
const KOKORO_LANG = { a: 'American', b: 'British', e: 'Spanish', f: 'French',
                      h: 'Hindi', i: 'Italian', j: 'Japanese', p: 'Portuguese',
                      z: 'Mandarin' };
function kokoroLabel(id) {
  const m = /^([abefhijpz])([fm])_(.+)$/.exec(id);
  if (!m) return id;
  const name = m[3].charAt(0).toUpperCase() + m[3].slice(1);
  return name + ' — ' + KOKORO_LANG[m[1]] + ' ' + (m[2] === 'f' ? 'female' : 'male');
}

function fillVoices() {
  const sel = $('voiceSel');
  sel.innerHTML = '';
  const add = (value, label) => {
    const o = document.createElement('option');
    o.value = value;
    o.textContent = label;
    sel.appendChild(o);
  };
  if (ttsEngineNow() === 'kokoro') {
    if (!kokoroVoices.length) {
      add('', kokoroErr ? 'unavailable — ' + kokoroErr : 'loading…');
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    for (const v of kokoroVoices) add(v, kokoroLabel(v));
    sel.value = kokoroVoices.includes(kokoroVoice()) ? kokoroVoice() : kokoroVoices[0];
  } else {
    const vs = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : [];
    if (!vs.length) {
      // Firefox on Linux has no voices at all without speech-dispatcher.
      add('', 'no voices installed in this browser');
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    // English first: the advisor speaks it, and Chrome lists a hundred others.
    const sorted = vs.slice().sort((a, b) =>
      (/^en/.test(b.lang) ? 1 : 0) - (/^en/.test(a.lang) ? 1 : 0));
    for (const v of sorted) add(v.voiceURI, v.name + ' (' + v.lang + ')');
    if (ttsVoice) sel.value = ttsVoice.voiceURI;
  }
}

function fillSheet() {
  for (const b of $('sttSeg').children) {
    b.classList.toggle('on', b.dataset.mode === sttMode);
    b.disabled = b.dataset.mode === 'server' && !serverSTT;
  }
  for (const b of $('ttsSeg').children) {
    b.classList.toggle('on', b.dataset.engine === ttsEngineNow());
    b.disabled = b.dataset.engine === 'kokoro' && !serverTTS;
  }
  const stt = $('sttHint');
  stt.className = 'hint';
  if (!serverSTT) {
    stt.textContent = SR
      ? 'No transcription server configured — set stt_url in config.toml to add one.'
      : 'No dictation here: this browser has no recognizer, and stt_url is unset in config.toml.';
    if (!SR) stt.className = 'hint warn';
  } else if (!SR) {
    stt.textContent = 'This browser has no recognizer of its own, so Auto records and sends the audio to your server.';
  } else {
    stt.textContent = 'Auto uses the browser recognizer where there is one, and your server where there is not.';
  }
  const tts = $('ttsHint');
  tts.className = 'hint';
  tts.textContent = serverTTS
    ? 'Kokoro runs on the machine serving this page; Browser uses whatever voices it has (espeak, on Linux).'
    : 'No speech server configured — set tts_url in config.toml to add Kokoro.';
  fillVoices();
}

$('settingsBtn').onclick = () => {
  unlockTTS();               // spend the tap: the Test button below needs it
  $('sheet').hidden = false;
  fillSheet();
  if (serverTTS && !kokoroVoices.length) loadKokoroVoices();
};
$('sheetClose').onclick = () => { $('sheet').hidden = true; };
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };

for (const b of $('sttSeg').children) {
  b.onclick = () => {
    sttMode = b.dataset.mode;
    localStorage.setItem('vp.sttMode', sttMode);
    // The choice only takes effect on the next turn; don't leave the old path
    // holding the mic in the meantime.
    releaseMic();
    fillSheet();
  };
}
for (const b of $('ttsSeg').children) {
  b.onclick = () => {
    ttsEngine = b.dataset.engine;
    localStorage.setItem('vp.ttsEngine', ttsEngine);
    stopSpeaking();
    if (ttsEngine === 'kokoro' && !kokoroVoices.length) loadKokoroVoices();
    fillSheet();
  };
}
$('voiceSel').onchange = e => {
  const v = e.target.value;
  if (!v) return;
  if (ttsEngineNow() === 'kokoro') {
    localStorage.setItem('vp.voice.kokoro', v);
  } else {
    localStorage.setItem('vp.voice.browser', v);
    pickVoice();
  }
};
$('voiceTest').onclick = () => {
  unlockTTS();
  stopSpeaking();
  const name = ttsEngineNow() === 'kokoro'
    ? kokoroLabel(kokoroVoice()).split(' — ')[0]
    : (ttsVoice ? ttsVoice.name : 'default');
  speakText('This is ' + name + ', reading a reply from your agent.');
};

/* ---------- ui wiring ---------- */
function setDest(d) {
  dest = d;
  document.body.classList.toggle('destProject', d === 'project');
  $('destAdvisor').classList.toggle('on', d === 'advisor');
  $('destProject').classList.toggle('on', d === 'project');
  $('send').textContent = d === 'advisor' ? 'Ask' : 'Send ➤';
  updateTarget();
}
$('destAdvisor').onclick = () => setDest('advisor');
$('destProject').onclick = () => setDest('project');

function setSpeak(on) {
  speakOn = on;
  localStorage.setItem('vp.speak', on ? '1' : '0');
  $('btnSpeak').classList.toggle('on', on);
  if (on) unlockTTS(); else stopSpeaking();
}
function setConvo(on) {
  handsFree = on;
  $('btnConvo').classList.toggle('on', on);
  emptyListens = 0;
  if (on) {
    unlockTTS();
    setDest('advisor');
    startListen();
  } else {
    stopListen();
    // Convo owns the mic, not the speaker: a reply already being read aloud
    // finishes on its own, and holds the strip until it does. Speak (or the mic
    // button) is what stops audio.
    if (!ttsActive) setVoiceState(null);
  }
}
$('btnSpeak').onclick = () => setSpeak(!speakOn);
$('btnConvo').onclick = () => setConvo(!handsFree);

$('mic').onclick = () => {
  unlockTTS();
  if (ttsActive) { stopSpeaking(); if (handsFree) startListen(); return; }
  if (listening) {
    // Hands-free exists to re-arm the mic after every turn, so leaving it on
    // would restart what this tap just stopped. Tapping the mic off ends the
    // conversation loop too, which is what "off" has to mean to hold.
    if (handsFree) setConvo(false);
    else stopListen();
  } else startListen();
};

// Don't hold the mic into a backgrounded or unloaded page.
addEventListener('pagehide', releaseMic);

$('send').onclick = () => {
  const text = $('input').value.trim();
  if (!text) return;
  if (dest === 'advisor') {
    $('input').value = ''; autogrow();
    askAdvisor('discuss', text);
  } else {
    sendProject(text);
  }
};
$('btnStatus').onclick = () => { unlockTTS(); askAdvisor('status', ''); };
$('btnBrainstorm').onclick = () => {
  unlockTTS();
  const text = $('input').value.trim();
  $('input').value = ''; autogrow();
  askAdvisor('brainstorm', text);
};
/* Clears one column's conversation — both the transcript and the stored
   session id, so the next turn starts genuinely cold rather than merely
   looking empty. Takes the column rather than reading the focus, because the
   per-column buttons act on the column they sit in, focused or not. */
async function clearChat(v) {
  const key = keyFor(v);
  if (!key) return;
  const who = v === 'projects' ? 'the operator' : '"' + current + '"';
  if (!confirm('Start a new chat with ' + who + '? History will be cleared.')) return;
  await api('/api/reset', { body: { project: key } });
  renderHistory([], v);
}
$('newchat').onclick = () => clearChat(view);
$('clearOperator').onclick = () => clearChat('projects');
$('clearProject').onclick = () => clearChat('project');
// A full reload, so a new build of the page is picked up too; the view and
// project come back from localStorage.
$('refresh').onclick = () => location.reload();
$('project').onchange = e => selectProject(e.target.value);

function autogrow() {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 150) + 'px';
}
$('input').addEventListener('input', autogrow);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('send').click(); }
});

if (speakOn) $('btnSpeak').classList.add('on');
setTtsRate(ttsRate);
metaReady = api('/api/meta').then(m => {
  voiceOn = m.voice !== false;
  jiraOn = !!m.jira;
  jiraUrl = m.jira_url || '';
  usageOn = !!m.usage;
  if (m.default_agent) DEFAULT_AGENT = m.default_agent;
  if (m.tts_rate) setTtsRate(m.tts_rate);
  for (const a of (m.agents || [])) if (!AGENT_SHORT[a.id]) AGENT_SHORT[a.id] = a.label;
  document.body.classList.toggle('noVoice', !voiceOn);
  document.body.classList.toggle('noJira', !jiraOn);
  if (m.https_port !== undefined) httpsPort = m.https_port;   // 0 = HTTPS is off
  if (m.http_port) httpPort = m.http_port;
  summarizeOn = m.summarize !== false;
  serverSTT = !!m.stt;
  serverTTS = !!m.tts;
  operatorOn = !!m.operator;
  if (m.operator_key) OPERATOR = m.operator_key;
  if (m.tts_voice) defaultKokoroVoice = m.tts_voice;
  terminalWeb = m.terminal || null;
  defaultTtsEngine();
  if (serverTTS && voiceOn) loadKokoroVoices();
  serverMusic = m.music !== false;
  applyMusic();
}).catch(() => {});
/* Open on the agent cards, or back in the one project you were talking to —
   a reload mid-conversation shouldn't lose it. The operator is a tap away. */
(async () => {
  try { await metaReady; } catch (e) {}
  await loadProjects();
  // Open on something that's actually being watched: the tiles show the
  // selected projects, so focusing one outside that set looks like a mistake.
  if (operatorOn && voiceOn) {
    try {
      const ov = await api('/api/overview?after=0');
      const picked = (ov.projects || []).filter(p => p.selected);
      if (picked.length && !picked.some(p => p.name === current)) current = picked[0].name;
    } catch (e) {}
  }
  // Back where you were: a list, or the one project you were talking to — a
  // reload mid-conversation shouldn't lose it.
  // A #home / #repos / #tickets / #talk link opens that tab; else where you were.
  const hash = location.hash.slice(1), was = localStorage.getItem('vp.view');
  await setView(LIST_VIEWS.includes(hash) ? hash : hash === 'talk' ? 'project'
                : ['home', 'repos', 'tickets', 'project'].includes(was) ? was : 'home');
  // Keep the Agents badge current from any tab.
  setInterval(() => { if (view !== 'home') loadHome().catch(() => {}); }, 15000);
})().catch(e => addBubble('err', esc(e.message)));
</script>
</body>
</html>
