<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1a5"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>
  <!-- the window: a terminal, seen whole -->
  <rect x="8" y="12" width="112" height="104" rx="18" fill="url(#bg)"/>
  <rect x="8" y="12" width="112" height="104" rx="18" fill="none" stroke="#3d4860" stroke-width="2"/>
  <circle cx="24" cy="27" r="4" fill="#e5a50a"/>
  <circle cx="37" cy="27" r="4" fill="#3584e4"/>
  <circle cx="50" cy="27" r="4" fill="#2ec27e"/>
  <!-- the operator's eye -->
  <path d="M18 72 Q64 30 110 72 Q64 114 18 72 Z" fill="#e8edf5"/>
  <circle cx="64" cy="72" r="22" fill="url(#iris)"/>
  <circle cx="64" cy="72" r="22" fill="none" stroke="#1b6f66" stroke-width="2"/>
  <!-- and in it, a prompt -->
  <path d="M53 63 L62 72 L53 81" fill="none" stroke="#151a24" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M65 82 L76 82" stroke="#151a24" stroke-width="5" stroke-linecap="round"/>
</svg>
